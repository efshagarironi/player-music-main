            fg.setColor(PROG_COLOR)
            fg.cornerRadius = t / 2f
            val clip = android.graphics.drawable.ClipDrawable(fg, Gravity.LEFT, android.graphics.drawable.ClipDrawable.HORIZONTAL)
            val ld = android.graphics.drawable.LayerDrawable(arrayOf<android.graphics.drawable.Drawable>(bg, clip))
            ld.setId(0, android.R.id.background)
            ld.setId(1, android.R.id.progress)
            for (i in 0..1) {
             ld.setLayerHeight(i, t)
             ld.setLayerGravity(i, Gravity.CENTER_VERTICAL)
            }
            val th = maxOf(Ui.dp(c, 12), (t * 2.8f).toInt())
            val thumb = android.graphics.drawable.GradientDrawable()
            thumb.shape = android.graphics.drawable.GradientDrawable.OVAL
            thumb.setColor(PROG_COLOR)
            thumb.setSize(th, th)
            sb.layoutDirection = View.LAYOUT_DIRECTION_LTR
            sb.progressDrawable = ld
            sb.thumb = thumb
            sb.setPadding(th / 2, 0, th / 2, 0)
           }

           fun size(c: Context) = get(c, specs[0])
           fun gap(c: Context) = get(c, specs[1])
           fun y(c: Context) = get(c, specs[2])
           fun x(c: Context) = get(c, specs[3])
          }

          // ---------------------------------------------------------------------------
          // Hamburger icon (three lines)
          // ---------------------------------------------------------------------------
          class HamburgerView(ctx: Context) : View(ctx) {
           private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply {
            color = Ui.TEXT
            style = Paint.Style.STROKE
            strokeCap = Paint.Cap.ROUND
           }

           override fun onDraw(c: Canvas) {
            val w = width.toFloat()
            val h = height.toFloat()
            val lineW = w * 0.46f
            val gap = h * 0.16f
            p.strokeWidth = h * 0.07f
            val x0 = (w - lineW) / 2f
            val cy = h / 2f
            for (i in -1..1) {
             c.drawLine(x0, cy + i * gap, x0 + lineW, cy + i * gap, p)
            }
           }
          }

          // ---------------------------------------------------------------------------
          // Menu page
          // ---------------------------------------------------------------------------
          // Player icon: square (home page, menu, app list) or round (floating button of the folders page)
          class PlayerGlyphView(ctx: Context) : View(ctx) {
           var round = false
           private val p = Paint(Paint.ANTI_ALIAS_FLAG)
           private val path = Path()
           private val clip = Path()
           private val box = RectF()

           init {
            outlineProvider = object : android.view.ViewOutlineProvider() {
             override fun getOutline(view: View?, outline: android.graphics.Outline?) {
              val w = view?.width ?: 0
              val h = view?.height ?: 0
              if (round) outline?.setOval(0, 0, w, h) else outline?.setRoundRect(0, 0, w, h, w * 0.22f)
             }
            }
           }

           private fun play(c: Canvas, cx: Float, cy: Float, s: Float) {
            val x0 = cx - 0.4f * s
            val x1 = cx + 0.5f * s
            val y0 = cy - 0.5f * s
            val y1 = cy + 0.5f * s
            path.reset()
            path.moveTo(x0, y0)
            path.lineTo(x0, y1)
            path.lineTo(x1, cy)
            path.close()
            p.reset()
            p.isAntiAlias = true
            p.style = Paint.Style.FILL
            p.pathEffect = CornerPathEffect(0.1f * s)
            p.shader = LinearGradient(x0, y0, x0, y1, Color.parseColor("#F8EEFF"), Color.parseColor("#6A1BFF"), Shader.TileMode.CLAMP)
            c.drawPath(path, p)
            p.shader = LinearGradient(x0, cy, x1, cy, Color.parseColor("#006A1BFF"), Color.parseColor("#E03FE0FF"), Shader.TileMode.CLAMP)
            c.drawPath(path, p)
            p.reset()
            p.isAntiAlias = true
           }

           private fun arc(c: Canvas, cx: Float, cy: Float, r: Float, sw: Float, start: Float, sweep: Float, col: Int) {
            box.set(cx - r, cy - r, cx + r, cy + r)
            p.reset()
            p.isAntiAlias = true
            p.style = Paint.Style.STROKE
            p.strokeCap = Paint.Cap.ROUND
            p.color = (col and 0x00FFFFFF) or 0x3C000000
            p.strokeWidth = sw * 2.2f
            c.drawArc(box, start, sweep, false, p)
            p.color = col
            p.strokeWidth = sw
            c.drawArc(box, start, sweep, false, p)
           }

           override fun onDraw(c: Canvas) {
            val w = width.toFloat()
            val h = height.toFloat()
            val cx = w / 2f
            val cy = h / 2f
            if (round) {
             p.reset()
             p.isAntiAlias = true
             p.color = Color.parseColor("#E00A0E2A")
             c.drawCircle(cx, cy, w * 0.49f, p)
             p.style = Paint.Style.STROKE
             p.strokeWidth = w * 0.018f
             p.shader = LinearGradient(0f, 0f, w, h, Color.parseColor("#8B3CF0"), Color.parseColor("#2F6BFF"), Shader.TileMode.CLAMP)
             c.drawCircle(cx, cy, w * 0.48f, p)
             val r = w * 0.37f
             val sw = w * 0.04f
             arc(c, cx, cy, r, sw, -85f, 77f, Color.parseColor("#3FE0FF"))
             arc(c, cx, cy, r, sw, 8f, 77f, Color.parseColor("#2BB6F0"))
             arc(c, cx, cy, r, sw, 95f, 77f, Color.parseColor("#B44CFF"))
             arc(c, cx, cy, r, sw, 188f, 77f, Color.parseColor("#D058FF"))
             play(c, cx, cy, w * 0.44f)
            } else {
             val rad = w * 0.22f
             box.set(0f, 0f, w, h)
             p.reset()
             p.isAntiAlias = true
             p.color = Color.parseColor("#070A1E")
             c.drawRoundRect(box, rad, rad, p)
             clip.reset()
             clip.addRoundRect(box, rad, rad, Path.Direction.CW)
             c.save()
             c.clipPath(clip)
             path.reset()
             path.moveTo(0f, 0f)
             path.lineTo(w, 0f)
             path.quadTo(w * 0.55f, h * 0.1f, w * 0.25f, h * 0.38f)
             path.quadTo(w * 0.08f, h * 0.55f, 0f, h * 0.62f)
             path.close()
             p.color = Color.parseColor("#467C3AED")
             c.drawPath(path, p)
             path.reset()
             path.moveTo(w, h)
             path.lineTo(0f, h)
             path.quadTo(w * 0.45f, h * 0.9f, w * 0.75f, h * 0.65f)
             path.quadTo(w * 0.95f, h * 0.48f, w, h * 0.4f)
             path.close()
             p.color = Color.parseColor("#502F6BFF")
             c.drawPath(path, p)
             c.restore()
             // neon border
             p.reset()
             p.isAntiAlias = true
             p.style = Paint.Style.STROKE
             p.strokeWidth = w * 0.022f
             p.shader = LinearGradient(0f, 0f, w, h, Color.parseColor("#D25BFF"), Color.parseColor("#3DA0FF"), Shader.TileMode.CLAMP)
             box.set(w * 0.011f, w * 0.011f, w - w * 0.011f, h - w * 0.011f)
             c.drawRoundRect(box, rad, rad, p)
             // ring with a small gap at the top
             val r = w * 0.345f
             val sw = w * 0.032f
             box.set(cx - r, cy - r, cx + r, cy + r)
             p.reset()
             p.isAntiAlias = true
             p.style = Paint.Style.STROKE
             p.strokeCap = Paint.Cap.ROUND
             p.strokeWidth = sw
             p.shader = SweepGradient(
              cx, cy,
              intArrayOf(Color.parseColor("#2DE2FF"), Color.parseColor("#3B82F6"), Color.parseColor("#A64CFF"), Color.parseColor("#D050FF"), Color.parseColor("#2DE2FF"), Color.parseColor("#2DE2FF")),
              floatArrayOf(0f, 0.25f, 0.5f, 0.74f, 0.76f, 1f)
             )
             c.drawArc(box, -80f, 340f, false, p)
             play(c, cx, cy, w * 0.42f)
            }
           }
          }

          class MenuActivity : Activity() {


           private fun dp(x: Int) = Ui.dp(this, x)

           private fun tv(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
            val t = TextView(this)
            t.text = s
            t.textSize = size
            t.setTextColor(color)
            if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
            return t
           }

           override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            window.statusBarColor = Ui.BG_TOP
            window.navigationBarColor = Ui.BG_BOTTOM

            val root = LinearLayout(this)
            root.orientation = LinearLayout.VERTICAL
            root.background = Ui.pageBg()
            root.layoutDirection = View.LAYOUT_DIRECTION_RTL

            val bar = LinearLayout(this)
            bar.orientation = LinearLayout.HORIZONTAL
            bar.gravity = Gravity.CENTER_VERTICAL
            bar.setPadding(dp(8), dp(14), dp(12), dp(10))

            val back = tv("→", 24f, Ui.TEXT)
            back.setPadding(dp(12), dp(4), dp(12), dp(4))
            back.setOnClickListener { onBackPressed() }
            bar.addView(back)
            bar.addView(tv("منو", 19f, Ui.TEXT, true), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
            root.addView(bar)

            val scroll = ScrollView(this)
            val body = LinearLayout(this)
            body.orientation = LinearLayout.VERTICAL
            body.setPadding(dp(16), dp(8), dp(16), dp(24))
            scroll.addView(body)
            root.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

            fun menuItem(title: String, subText: String, cls: Class<*>, top: Int, icon: String = "🎚"): TextView {
             val item = LinearLayout(this)
             item.orientation = LinearLayout.HORIZONTAL
             item.gravity = Gravity.CENTER_VERTICAL
             item.setPadding(dp(16), dp(14), dp(16), dp(14))
             val bg = Ui.grad(this, Ui.CARD, Color.parseColor("#16294A"), 20)
             bg.setStroke(dp(1), Color.parseColor("#2F456B"))
             item.background = bg
             item.isClickable = true
             item.setOnClickListener {
              Nav.open(this, cls)
             }

             val ic = tv(icon, 22f, Color.WHITE)
             ic.gravity = Gravity.CENTER
             ic.background = Ui.oval(Color.argb(60, 90, 130, 200))
             item.addView(ic, LinearLayout.LayoutParams(dp(48), dp(48)))

             val col = LinearLayout(this)
             col.orientation = LinearLayout.VERTICAL
             col.setPaddingRelative(dp(12), 0, dp(8), 0)
             col.addView(tv(title, 16f, Ui.TEXT, true))
             val sub = tv(subText, 12f, Ui.MUTED)
             sub.setPadding(0, dp(3), 0, 0)
             col.addView(sub)
             item.addView(col, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
             item.addView(tv("‹", 28f, Ui.MUTED, true))

             val p = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
             p.topMargin = dp(top)
             body.addView(item, p)
             return sub
            }

            menuItem("نوار بالا", "اندازه، جای آیکون‌ها و فاصله بین آنها در نوار بالای پخش‌کننده", BarSettingsActivity::class.java, 0)
            menuItem("نوار پیشرفت", "جای عمودی نوار پیشرفت و نوار پیشرفت نامرئی هنگام کشیدن انگشت روی تصویر", ProgressBarSettingsActivity::class.java, 14)
            menuItem("نوار پایین", "اندازه و جای جداگانه آیکون‌های پخش، قبلی، بعدی، تغییر اندازه تصویر و لیست تکرار و فاصله بین آنها", BottomBarSettingsActivity::class.java, 14)
              menuItem("امنیت", "قفل ورود به برنامه با رمز یا الگو، اثر انگشت یا چهره، قفل خود بخش امنیت و جلوگیری از حذف پلیر", SecurityActivity::class.java, 14, "🔒")

            // backup: outlined frame without fill, below all the options
            val backupBtn = tv("پشتیبان", 13f, Ui.TEXT, true)
            backupBtn.gravity = Gravity.CENTER
