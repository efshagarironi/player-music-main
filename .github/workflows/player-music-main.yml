          cat > app/src/main/java/com/sharedl/app/VaultImportActivity.kt <<'EOF'
          package com.sharedl.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File

          // ---------------------------------------------------------------------------
          // Receives videos from the Downloader app and copies them into a private folder
          // (existing one, or a new one with its own PIN / pattern). It answers with the list
          // of copied videos so the Downloader can remove its originals.
          // ---------------------------------------------------------------------------
          class VaultImportActivity : Activity() {
           private val ui = Handler(Looper.getMainLooper())
           private var uris: List<Uri> = emptyList()
           private var names: List<String> = emptyList()
           private var sizes: LongArray = LongArray(0)
           private var pName: String? = null

           private fun dp(x: Int): Int = Math.round(x * resources.displayMetrics.density)

           private fun fa(s: String): String {
            val sb = StringBuilder()
            for (ch in s) sb.append(if (ch in '0'..'9') ('\u06F0' + (ch - '0')) else ch)
            return sb.toString()
           }

           override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            val ua = intent.getStringArrayExtra("uris")
            if (ua == null || ua.isEmpty() || savedInstanceState != null) {
             setResult(RESULT_CANCELED)
             finish()
             return
            }
            val na = intent.getStringArrayExtra("names")
            val sa = intent.getLongArrayExtra("sizes")
            uris = ua.map { Uri.parse(it) }
            names = ua.indices.map { i -> VaultStore.safeName(na?.getOrNull(i) ?: "").ifEmpty { "video_" + i + ".mp4" } }
            sizes = LongArray(ua.size) { i -> sa?.getOrNull(i) ?: 0L }
            start()
           }

           private fun cancel() {
            setResult(RESULT_CANCELED)
            finish()
           }

           // the private folders page may have its own lock: it is asked first
           private fun start() {
            if (AppLock.vaultLock(this)) {
             val i = Intent(this, LockActivity::class.java)
             i.putExtra("mode", "unlock")
             i.putExtra("sec", true)
             i.putExtra("slot", "vault")
             startActivityForResult(i, 77)
            } else {
             chooseFolder()
            }
           }

           override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
            super.onActivityResult(requestCode, resultCode, data)
            if (requestCode == 77) {
             if (resultCode == RESULT_OK) chooseFolder() else cancel()
            } else if (requestCode == 82) {
             val n = pName
             if (resultCode == RESULT_OK && n != null) copyAll(n) else chooseFolder()
            }
           }

           private fun chooseFolder() {
            val list = VaultStore.list(this)
            val items = ArrayList<String>()
            for (n in list) items.add("🔒  " + n)
            items.add("＋  پوشهٔ خصوصی جدید")
            AlertDialog.Builder(this)
             .setTitle("انتقال " + fa(uris.size.toString()) + " فایل به پوشهٔ خصوصی")
             .setItems(items.toTypedArray()) { _, w ->
              if (w < list.size) copyAll(list[w]) else askNewFolder()
             }
             .setNegativeButton("لغو") { _, _ -> cancel() }
             .setOnCancelListener { cancel() }
             .show()
           }

           private fun askNewFolder() {
            val et = EditText(this)
            et.setSingleLine(true)
            et.hint = "نام پوشهٔ خصوصی"
            val box = FrameLayout(this)
            box.setPadding(dp(20), dp(8), dp(20), 0)
            box.addView(et, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
            AlertDialog.Builder(this)
             .setTitle("پوشهٔ خصوصی جدید")
             .setView(box)
             .setPositiveButton("ادامه") { _, _ ->
              val n = VaultStore.safeName(et.text.toString())
              if (n.isEmpty()) {
               Toast.makeText(this, "نام را وارد کن", Toast.LENGTH_SHORT).show()
               chooseFolder()
              } else if (VaultStore.exists(this, n)) {
               Toast.makeText(this, "این نام قبلاً وجود دارد", Toast.LENGTH_SHORT).show()
               chooseFolder()
              } else {
               AlertDialog.Builder(this)
                .setTitle("نوع قفل")
                .setItems(arrayOf("🔢  رمز عددی", "🔷  الگو")) { _, w ->
                 pName = n
                 val i = Intent(this, LockActivity::class.java)
                 i.putExtra("mode", "set")
                 i.putExtra("type", if (w == 0) "pin" else "pattern")
                 i.putExtra("vname", n)
                 startActivityForResult(i, 82)
                }
                .setOnCancelListener { chooseFolder() }
                .show()
              }
             }
             .setNegativeButton("لغو") { _, _ -> chooseFolder() }
             .setOnCancelListener { chooseFolder() }
             .show()
           }

           private fun uniqueFile(dir: File, name: String): File {
            var f = File(dir, name)
            if (!f.exists()) return f
            val dot = name.lastIndexOf('.')
            val stem = if (dot > 0) name.substring(0, dot) else name
            val ext = if (dot > 0) name.substring(dot) else ""
            var i = 1
            while (f.exists()) {
             f = File(dir, stem + " (" + i + ")" + ext)
             i++
            }
            return f
           }

           private fun copyAll(name: String) {
            val dest = VaultStore.dir(this, name)
            if (!dest.isDirectory && !dest.mkdirs()) {
             Toast.makeText(this, "ساخت پوشهٔ خصوصی ممکن نشد", Toast.LENGTH_SHORT).show()
             cancel()
             return
            }
            val pbox = LinearLayout(this)
            pbox.orientation = LinearLayout.VERTICAL
            pbox.layoutDirection = android.view.View.LAYOUT_DIRECTION_RTL
            pbox.setPadding(dp(24), dp(22), dp(24), dp(18))
            val ttl = TextView(this)
            ttl.text = "در حال انتقال به پوشهٔ خصوصی"
            ttl.textSize = 17f
            ttl.setTextColor(android.graphics.Color.WHITE)
            pbox.addView(ttl)
            val pbar = android.widget.ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
            pbar.max = uris.size
            pbar.progress = 0
            val pbl = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
            pbl.topMargin = dp(14)
            pbox.addView(pbar, pbl)
            val cnt = TextView(this)
            cnt.textSize = 13f
            cnt.setTextColor(android.graphics.Color.parseColor("#B0B8C5"))
            cnt.gravity = android.view.Gravity.CENTER
            cnt.setPadding(0, dp(8), 0, 0)
            pbox.addView(cnt)
            val pd = AlertDialog.Builder(this).setView(pbox).setCancelable(false).create()
            pd.show()
            pd.window?.setBackgroundDrawable(android.graphics.drawable.ColorDrawable(android.graphics.Color.parseColor("#424242")))
            val origin = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES), "Downloader").absolutePath
            Thread {
             val done = ArrayList<String>()
             var fail = 0
             for (i in uris.indices) {
              ui.post {
               pbar.progress = i + 1
               cnt.text = fa((i + 1).toString()) + " / " + fa(uris.size.toString())
              }
              var t: File? = null
              try {
               val need = sizes[i]
               val free = try {
                android.os.StatFs(dest.absolutePath).availableBytes
               } catch (e: Throwable) {
                Long.MAX_VALUE
               }
               if (free < need + 20L * 1024L * 1024L) throw java.io.IOException("no space")
               val f = uniqueFile(dest, names[i])
               t = f
               val ins = contentResolver.openInputStream(uris[i]) ?: throw java.io.IOException("no input")
               ins.use { input ->
                java.io.FileOutputStream(f).use { outs -> input.copyTo(outs, 256 * 1024) }
               }
               if (need > 0L && f.length() != need) throw java.io.IOException("size mismatch")
               VaultStore.setOrigin(this, name, f.name, origin)
               done.add(uris[i].toString())
              } catch (e: Throwable) {
               fail++
               try {
                t?.delete()
               } catch (x: Throwable) {
               }
              }
             }
             ui.post {
              try {
               pd.dismiss()
              } catch (e: Throwable) {
              }
              var msg = "به پوشهٔ خصوصی منتقل شد: " + fa(done.size.toString())
              if (fail > 0) msg += "  ·  ناموفق: " + fa(fail.toString())
              Toast.makeText(this, msg, Toast.LENGTH_LONG).show()
              val r = Intent()
              r.putExtra("done", done.toTypedArray())
              setResult(RESULT_OK, r)
              finish()
             }
            }.start()
           }
          }
          EOF

