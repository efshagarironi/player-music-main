          class RestoreActivity : Activity() {

           private var files = ArrayList<File>()
           private val sel = HashSet<String>()
           private var selMode = false
           private lateinit var titleTv: TextView
           private lateinit var selAll: TextView
           private lateinit var delBtn: TextView
           private lateinit var empty: TextView
           private val adapter = Adapter()

           private fun dp(x: Int) = Ui.dp(this, x)

           private fun tv(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
            val t = TextView(this)
            t.text = s
            t.textSize = size
            t.setTextColor(color)
            if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
            return t
           }

           override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            window.statusBarColor = Ui.BG_TOP
            window.navigationBarColor = Ui.BG_BOTTOM
            val root = LinearLayout(this)
            root.orientation = LinearLayout.VERTICAL
            root.background = Ui.pageBg()
            root.layoutDirection = View.LAYOUT_DIRECTION_RTL

            val bar = LinearLayout(this)
            bar.orientation = LinearLayout.HORIZONTAL
            bar.gravity = Gravity.CENTER_VERTICAL
            bar.setPadding(dp(8), dp(14), dp(12), dp(10))
            val back = tv("→", 24f, Ui.TEXT)
            back.setPadding(dp(12), dp(4), dp(12), dp(4))
            back.setOnClickListener { onBackPressed() }
            bar.addView(back)
            titleTv = tv("فراخوان پشتیبان", 19f, Ui.TEXT, true)
            bar.addView(titleTv, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
            selAll = tv("همه", 15f, Ui.GREEN, true)
            selAll.setPadding(dp(12), dp(6), dp(12), dp(6))
            selAll.visibility = View.GONE
            selAll.setOnClickListener {
             if (sel.size == files.size) sel.clear() else for (f in files) sel.add(f.absolutePath)
             if (sel.isEmpty()) exitSel() else refresh()
            }
            bar.addView(selAll)
            delBtn = tv("🗑", 20f, Ui.DANGER)
            delBtn.setPadding(dp(12), dp(4), dp(12), dp(4))
            delBtn.visibility = View.GONE
            delBtn.setOnClickListener { confirmDelete() }
            bar.addView(delBtn)
            root.addView(bar)

            val list = ListView(this)
            list.divider = null
            list.dividerHeight = dp(10)
            list.setPadding(dp(16), dp(8), dp(16), dp(24))
            list.clipToPadding = false
            list.selector = android.graphics.drawable.ColorDrawable(Color.TRANSPARENT)
            list.adapter = adapter
            list.setOnItemClickListener { _, _, p, _ ->
             val f = files.getOrNull(p)
             if (f != null) {
              if (selMode) toggle(f) else confirmRestore(f)
             }
            }
            list.setOnItemLongClickListener { _, _, p, _ ->
             val f = files.getOrNull(p)
             if (f != null) {
              if (!selMode) {
               selMode = true
               sel.add(f.absolutePath)
               refresh()
              } else {
               toggle(f)
              }
             }
             true
            }
            val frame = android.widget.FrameLayout(this)
            frame.addView(list, android.widget.FrameLayout.LayoutParams(-1, -1))
            empty = tv("نسخه پشتیبانی پیدا نشد", 14f, Ui.MUTED)
            empty.gravity = Gravity.CENTER
            empty.visibility = View.GONE
            frame.addView(empty, android.widget.FrameLayout.LayoutParams(-1, -1))
            root.addView(frame, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
            setContentView(root)
           }

           override fun onResume() {
            super.onResume()
            if (!BackupStore.hasAccess(this)) BackupStore.askAccess(this)
            load()
           }

           private fun load() {
            files = BackupStore.list(this)
            val keep = HashSet<String>()
            for (f in files) if (sel.contains(f.absolutePath)) keep.add(f.absolutePath)
            sel.clear()
            sel.addAll(keep)
            if (sel.isEmpty()) selMode = false
            refresh()
           }

           private fun refresh() {
            titleTv.text = if (selMode) sel.size.toString() + " انتخاب شده" else "فراخوان پشتیبان"
            selAll.visibility = if (selMode) View.VISIBLE else View.GONE
            delBtn.visibility = if (selMode) View.VISIBLE else View.GONE
            empty.visibility = if (files.isEmpty()) View.VISIBLE else View.GONE
            adapter.notifyDataSetChanged()
           }

           private fun exitSel() {
            selMode = false
            sel.clear()
            refresh()
           }

           private fun toggle(f: File) {
            val k = f.absolutePath
            if (sel.contains(k)) sel.remove(k) else sel.add(k)
            if (sel.isEmpty()) exitSel() else refresh()
           }

           private fun confirmRestore(f: File) {
            AlertDialog.Builder(this)
             .setTitle("فراخوان این پشتیبان؟")
             .setMessage("تنظیمات فعلی برنامه با تنظیمات این نسخه جایگزین می‌شود.")
             .setPositiveButton("فراخوان") { _, _ ->
              if (BackupStore.restore(this, f)) {
               Toast.makeText(this, "تنظیمات فراخوانی شد", Toast.LENGTH_SHORT).show()
               val i = Intent(this, FolderBrowserActivity::class.java)
               i.putExtra("standalone", true)
               i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK)
               startActivity(i)
               finish()
              } else {
               Toast.makeText(this, "این فایل پشتیبان معتبر نیست", Toast.LENGTH_LONG).show()
              }
             }
             .setNegativeButton("لغو", null)
             .show()
           }

           private fun confirmDelete() {
            if (sel.isEmpty()) return
            AlertDialog.Builder(this)
             .setTitle("حذف پشتیبان")
             .setMessage(sel.size.toString() + " نسخه پشتیبان حذف شود؟")
             .setPositiveButton("حذف") { _, _ ->
              for (p in sel) {
               try {
                File(p).delete()
               } catch (e: Throwable) {
               }
              }
              sel.clear()
              selMode = false
              load()
             }
             .setNegativeButton("لغو", null)
             .show()
           }

           override fun onBackPressed() {
            if (selMode) exitSel() else super.onBackPressed()
           }

           override fun finish() {
            super.finish()
            Nav.close(this)
           }

           inner class Adapter : BaseAdapter() {
            override fun getCount(): Int = files.size
            override fun getItem(position: Int): Any = files[position]
            override fun getItemId(position: Int): Long = position.toLong()

            override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
             val f = files[position]
             val row = LinearLayout(this@RestoreActivity)
             row.orientation = LinearLayout.HORIZONTAL
             row.gravity = Gravity.CENTER_VERTICAL
             row.setPadding(dp(16), dp(14), dp(16), dp(14))
             val on = sel.contains(f.absolutePath)
             row.background = Ui.rect(this@RestoreActivity, if (on) Ui.GREEN_SEL else Ui.CARD, 16, if (on) Ui.GREEN else Ui.CARD_STROKE, 1)
             if (selMode) {
              val cb = tv(if (on) "☑" else "☐", 22f, if (on) Ui.GREEN else Ui.MUTED)
              cb.setPaddingRelative(0, 0, dp(12), 0)
              row.addView(cb)
             }
             val col = LinearLayout(this@RestoreActivity)
             col.orientation = LinearLayout.VERTICAL
             col.addView(tv(SimpleDateFormat("yyyy/MM/dd   HH:mm:ss", Locale.US).format(Date(f.lastModified())), 15f, Ui.TEXT, true))
             val sub = tv(f.name + "  ·  " + String.format(Locale.US, "%.1f KB", f.length() / 1024.0), 11f, Ui.MUTED)
             sub.setPadding(0, dp(3), 0, 0)
             col.addView(sub)
             row.addView(col, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
             return row
            }
           }
          }
