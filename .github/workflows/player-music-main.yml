          cat > app/src/main/java/com/sharedl/app/Core.kt <<'EOF'
          package com.sharedl.app

          fun fmtBytes(b: Long): String {
           val v = b.toDouble()
           return when {
            v >= 1073741824.0 -> String.format(java.util.Locale.US, "%.2f GB", v / 1073741824.0)
            v >= 1048576.0 -> String.format(java.util.Locale.US, "%.1f MB", v / 1048576.0)
            else -> String.format(java.util.Locale.US, "%d KB", (v / 1024.0).toLong())
           }
          }

          EOF

          cat > app/src/main/java/com/sharedl/app/Ui.kt <<'EOF'
          package com.sharedl.app

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.drawable.GradientDrawable
          import android.view.View
          import android.view.ViewOutlineProvider
          import java.util.Locale

          object Ui {
           val BG_TOP: Int = Color.parseColor("#0B1220")
           val BG_BOTTOM: Int = Color.parseColor("#13243F")
           val CARD: Int = Color.parseColor("#1A2438")
           val CARD_STROKE: Int = Color.parseColor("#2A3A57")
           val FIELD: Int = Color.parseColor("#0F1829")
           val GREEN: Int = Color.parseColor("#22C55E")
           val GREEN_DARK: Int = Color.parseColor("#16A34A")
           val GREEN_SEL: Int = Color.parseColor("#123B27")
           val TEXT: Int = Color.parseColor("#F1F5F9")
           val MUTED: Int = Color.parseColor("#94A3B8")
           val DANGER: Int = Color.parseColor("#EF4444")

           fun dp(ctx: Context, x: Int): Int = (x * ctx.resources.displayMetrics.density).toInt()

           fun rect(ctx: Context, fill: Int, radiusDp: Int, stroke: Int = 0, strokeDp: Int = 0): GradientDrawable {
            val g = GradientDrawable()
            g.setColor(fill)
            g.setCornerRadius(dp(ctx, radiusDp).toFloat())
            if (strokeDp > 0) g.setStroke(dp(ctx, strokeDp), stroke)
            return g
           }

           fun grad(ctx: Context, from: Int, to: Int, radiusDp: Int): GradientDrawable {
            val g = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(from, to))
            g.setCornerRadius(dp(ctx, radiusDp).toFloat())
            return g
           }

           fun oval(fill: Int, stroke: Int = 0, strokePx: Int = 0): GradientDrawable {
            val g = GradientDrawable()
            g.setShape(GradientDrawable.OVAL)
            g.setColor(fill)
            if (strokePx > 0) g.setStroke(strokePx, stroke)
            return g
           }

           fun pageBg(): GradientDrawable =
            GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(BG_TOP, BG_BOTTOM))

           fun roundClip(v: View, radiusDp: Int) {
            val r = dp(v.context, radiusDp).toFloat()
            v.outlineProvider = object : ViewOutlineProvider() {
             override fun getOutline(view: View?, outline: Outline?) {
              outline?.setRoundRect(0, 0, view?.width ?: 0, view?.height ?: 0, r)
             }
            }
            v.clipToOutline = true
           }

           fun dur(ms: Long): String {
            val s = ms / 1000
            val h = s / 3600
            val m = (s % 3600) / 60
            val sec = s % 60
            return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, sec)
            else String.format(Locale.US, "%d:%02d", m, sec)
           }

           fun size(b: Long): String {
            val mb = b / 1048576.0
            return if (mb >= 1024) String.format(Locale.US, "%.2f GB", mb / 1024)
            else String.format(Locale.US, "%.1f MB", mb)
           }
          }
          EOF

          cat > app/src/main/java/com/sharedl/app/BarSettingsActivity.kt <<'EOF'
          package com.sharedl.app

          import android.app.Activity
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class BarSettingsActivity : Activity() {

           private lateinit var previewTop: LinearLayout
           private val previewIcons = ArrayList<View>()
           private val seekBars = ArrayList<SeekBar>()
           private val valueViews = ArrayList<TextView>()
           private val cur = IntArray(BarPrefs.specs.size)

           private fun dp(x: Int) = Ui.dp(this, x)

           private fun tv(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
            val t = TextView(this)
            t.text = s
            t.textSize = size
            t.setTextColor(color)
            if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
            return t
           }

           private fun lp(top: Int): LinearLayout.LayoutParams {
            val p = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
            p.topMargin = dp(top)
            return p
           }

           override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            window.statusBarColor = Ui.BG_TOP
            window.navigationBarColor = Ui.BG_BOTTOM

            for (i in BarPrefs.specs.indices) cur[i] = BarPrefs.get(this, BarPrefs.specs[i])

            val root = LinearLayout(this)
            root.orientation = LinearLayout.VERTICAL
            root.background = Ui.pageBg()
            root.layoutDirection = View.LAYOUT_DIRECTION_RTL

            val bar = LinearLayout(this)
            bar.orientation = LinearLayout.HORIZONTAL
            bar.gravity = Gravity.CENTER_VERTICAL
            bar.setPadding(dp(8), dp(14), dp(12), dp(10))
            val back = tv("→", 24f, Ui.TEXT)
            back.setPadding(dp(12), dp(4), dp(12), dp(4))
            back.setOnClickListener { onBackPressed() }
            bar.addView(back)
            bar.addView(tv("نوار بالا", 19f, Ui.TEXT, true), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
            val reset = tv("بازنشانی", 13f, Ui.GREEN, true)
            reset.setPadding(dp(10), dp(8), dp(10), dp(8))
            reset.setOnClickListener { resetAll() }
            bar.addView(reset)
            root.addView(bar)

            val scroll = ScrollView(this)
            val body = LinearLayout(this)
            body.orientation = LinearLayout.VERTICAL
            body.setPadding(dp(16), dp(4), dp(16), dp(24))
            scroll.addView(body)
            root.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

            // ---- live preview of the player's top bar ----
            body.addView(tv("پیش‌نمایش نوار بالای پخش‌کننده", 12.5f, Ui.MUTED), lp(0))

            val box = FrameLayout(this)
            box.background = Ui.rect(this, Color.BLACK, 18, Ui.CARD_STROKE, 1)
            box.layoutDirection = View.LAYOUT_DIRECTION_LTR

            previewTop = LinearLayout(this)
            previewTop.orientation = LinearLayout.HORIZONTAL
            previewTop.gravity = Gravity.CENTER_VERTICAL

            fun icon(kind: Int, alpha: Float): RepeatIconView {
             val v = RepeatIconView(this)
             v.kind = kind
             v.alpha = alpha
             previewIcons.add(v)
             return v
            }

            previewTop.addView(icon(7, 0.6f))
            val rep = icon(0, 1f)
            rep.mode = 1
            previewTop.addView(rep)
            val asp = icon(5, 0.6f)
            previewTop.addView(asp)

            val title = tv("عنوان ویدئو", 14f, Color.WHITE)
            title.maxLines = 1
            title.ellipsize = TextUtils.TruncateAt.END
            title.gravity = Gravity.CENTER
            previewTop.addView(title, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

            previewTop.addView(icon(2, 0.6f))

            box.addView(previewTop, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP))
            body.addView(box, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(190)).also { it.topMargin = dp(6) })

            // ---- sliders ----
            for (i in BarPrefs.specs.indices) {
             body.addView(sliderCard(i, BarPrefs.specs[i]), lp(14))
            }

            applyPreview()
            setContentView(root)
           }

           private fun sliderCard(i: Int, s: BarPrefs.Spec): View {
            val card = LinearLayout(this)
            card.orientation = LinearLayout.VERTICAL
            card.setPadding(dp(16), dp(14), dp(16), dp(10))
            card.background = Ui.rect(this, Ui.CARD, 20, Ui.CARD_STROKE, 1)

            val head = LinearLayout(this)
            head.orientation = LinearLayout.HORIZONTAL
            head.gravity = Gravity.CENTER_VERTICAL
            head.addView(tv(s.title, 14.5f, Ui.TEXT, true), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
            val value = tv(cur[i].toString(), 13f, Ui.GREEN, true)
            head.addView(value)
            card.addView(head)
            card.addView(tv(s.sub, 12f, Ui.MUTED))

            val sb = SeekBar(this)
            sb.layoutDirection = View.LAYOUT_DIRECTION_LTR
            sb.progressTintList = ColorStateList.valueOf(Ui.GREEN)
            sb.thumbTintList = ColorStateList.valueOf(Ui.GREEN)
            sb.progressBackgroundTintList = ColorStateList.valueOf(Ui.CARD_STROKE)
            sb.max = s.max - s.min
            sb.progress = cur[i] - s.min
            sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
             override fun onProgressChanged(b: SeekBar?, p: Int, fromUser: Boolean) {
              cur[i] = p + s.min
              value.text = cur[i].toString()
              BarPrefs.set(this@BarSettingsActivity, s, cur[i])
              applyPreview()
             }

             override fun onStartTrackingTouch(b: SeekBar?) {}
             override fun onStopTrackingTouch(b: SeekBar?) {}
            })
            card.addView(sb, lp(6))

            seekBars.add(sb)
            valueViews.add(value)
            return card
           }

           private fun resetAll() {
            BarPrefs.reset(this)
            for (i in BarPrefs.specs.indices) {
             val s = BarPrefs.specs[i]
             cur[i] = s.def
             seekBars[i].progress = s.def - s.min
             valueViews[i].text = s.def.toString()
            }
            applyPreview()
           }

           private fun applyPreview() {
            val size = cur[0]
            val gap = cur[1]
            val y = cur[2]
            val x = cur[3]
            previewTop.setPadding(dp(x), dp(y), dp(x), 0)
            for (v in previewIcons) {
             val p = LinearLayout.LayoutParams(dp(size), dp(size))
             p.marginStart = dp(gap) / 2
             p.marginEnd = dp(gap) / 2
             p.gravity = Gravity.CENTER_VERTICAL
             v.layoutParams = p
             val pad = dp(size) / 5
             v.setPadding(pad, pad, pad, pad)
            }
           }

           override fun finish() {
            super.finish()
            Nav.close(this)
           }
          }
          EOF

          cat > app/src/main/java/com/sharedl/app/BottomBarSettingsActivity.kt <<'EOF'
