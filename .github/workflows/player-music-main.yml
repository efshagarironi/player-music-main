          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class ProgressBarSettingsActivity : Activity() {

           private val specs = BarPrefs.progressSpecs
           private val cur = IntArray(specs.size)
           private val seekBars = HashMap<Int, SeekBar>()
           private val valueViews = HashMap<Int, TextView>()

           private fun dp(x: Int) = Ui.dp(this, x)

           private fun tv(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
            val t = TextView(this)
