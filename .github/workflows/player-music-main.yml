            next.translationX = d(g(7)).toFloat(); next.translationY = d(g(8)).toFloat()
           }

           private fun prefs(c: Context) = c.getSharedPreferences("prefs", Context.MODE_PRIVATE)

           fun get(c: Context, s: Spec): Int = prefs(c).getInt(s.key, s.def).coerceIn(s.min, s.max)

           fun set(c: Context, s: Spec, v: Int) {
            prefs(c).edit().putInt(s.key, v.coerceIn(s.min, s.max)).apply()
           }

           fun reset(c: Context) {
            val e = prefs(c).edit()
            for (s in specs) e.remove(s.key)
            e.apply()
           }

           val PROG_COLOR: Int = Color.parseColor("#64B5FF")
           val TRACK_COLOR: Int = Color.parseColor("#555559")

           // Light-blue progress, gray track, round thumb; thickness in dp
           fun styleSeek(c: Context, sb: android.widget.SeekBar, thickDp: Int) {
            val t = Ui.dp(c, thickDp)
            val bg = android.graphics.drawable.GradientDrawable()
            bg.setColor(TRACK_COLOR)
            bg.cornerRadius = t / 2f
            val fg = android.graphics.drawable.GradientDrawable()
            fg.setColor(PROG_COLOR)
            fg.cornerRadius = t / 2f
            val clip = android.graphics.drawable.ClipDrawable(fg, Gravity.LEFT, android.graphics.drawable.ClipDrawable.HORIZONTAL)
            val ld = android.graphics.drawable.LayerDrawable(arrayOf<android.graphics.drawable.Drawable>(bg, clip))
            ld.setId(0, android.R.id.background)
            ld.setId(1, android.R.id.progress)
            for (i in 0..1) {
             ld.setLayerHeight(i, t)
             ld.setLayerGravity(i, Gravity.CENTER_VERTICAL)
            }
            val th = maxOf(Ui.dp(c, 12), (t * 2.8f).toInt())
            val thumb = android.graphics.drawable.GradientDrawable()
            thumb.shape = android.graphics.drawable.GradientDrawable.OVAL
            thumb.setColor(PROG_COLOR)
            thumb.setSize(th, th)
            sb.layoutDirection = View.LAYOUT_DIRECTION_LTR
            sb.progressDrawable = ld
            sb.thumb = thumb
            sb.setPadding(th / 2, 0, th / 2, 0)
           }

           fun size(c: Context) = get(c, specs[0])
           fun gap(c: Context) = get(c, specs[1])
           fun y(c: Context) = get(c, specs[2])
           fun x(c: Context) = get(c, specs[3])
          }

          // ---------------------------------------------------------------------------
          // Hamburger icon (three lines)
          // ---------------------------------------------------------------------------
          class HamburgerView(ctx: Context) : View(ctx) {
           private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply {
            color = Ui.TEXT
            style = Paint.Style.STROKE
            strokeCap = Paint.Cap.ROUND
           }

           override fun onDraw(c: Canvas) {
            val w = width.toFloat()
            val h = height.toFloat()
            val lineW = w * 0.46f
            val gap = h * 0.16f
            p.strokeWidth = h * 0.07f
            val x0 = (w - lineW) / 2f
            val cy = h / 2f
            for (i in -1..1) {
             c.drawLine(x0, cy + i * gap, x0 + lineW, cy + i * gap, p)
            }
           }
          }

          // ---------------------------------------------------------------------------
          // Menu page
          // ---------------------------------------------------------------------------
          // Player icon: square (home page, menu, app list) or round (floating button of the folders page)
          class PlayerGlyphView(ctx: Context) : View(ctx) {
           var round = false
           private val p = Paint(Paint.ANTI_ALIAS_FLAG)
           private val path = Path()
           private val clip = Path()
           private val box = RectF()

           init {
            outlineProvider = object : android.view.ViewOutlineProvider() {
             override fun getOutline(view: View?, outline: android.graphics.Outline?) {
              val w = view?.width ?: 0
              val h = view?.height ?: 0
              if (round) outline?.setOval(0, 0, w, h) else outline?.setRoundRect(0, 0, w, h, w * 0.22f)
             }
            }
           }

           private fun play(c: Canvas, cx: Float, cy: Float, s: Float) {
            val x0 = cx - 0.4f * s
            val x1 = cx + 0.5f * s
            val y0 = cy - 0.5f * s
            val y1 = cy + 0.5f * s
            path.reset()
            path.moveTo(x0, y0)
            path.lineTo(x0, y1)
            path.lineTo(x1, cy)
            path.close()
            p.reset()
            p.isAntiAlias = true
            p.style = Paint.Style.FILL
            p.pathEffect = CornerPathEffect(0.1f * s)
            p.shader = LinearGradient(x0, y0, x0, y1, Color.parseColor("#F8EEFF"), Color.parseColor("#6A1BFF"), Shader.TileMode.CLAMP)
            c.drawPath(path, p)
            p.shader = LinearGradient(x0, cy, x1, cy, Color.parseColor("#006A1BFF"), Color.parseColor("#E03FE0FF"), Shader.TileMode.CLAMP)
            c.drawPath(path, p)
            p.reset()
            p.isAntiAlias = true
           }

           private fun arc(c: Canvas, cx: Float, cy: Float, r: Float, sw: Float, start: Float, sweep: Float, col: Int) {
            box.set(cx - r, cy - r, cx + r, cy + r)
            p.reset()
            p.isAntiAlias = true
            p.style = Paint.Style.STROKE
            p.strokeCap = Paint.Cap.ROUND
            p.color = (col and 0x00FFFFFF) or 0x3C000000
            p.strokeWidth = sw * 2.2f
            c.drawArc(box, start, sweep, false, p)
            p.color = col
            p.strokeWidth = sw
            c.drawArc(box, start, sweep, false, p)
           }

           override fun onDraw(c: Canvas) {
            val w = width.toFloat()
            val h = height.toFloat()
            val cx = w / 2f
            val cy = h / 2f
            if (round) {
             p.reset()
             p.isAntiAlias = true
             p.color = Color.parseColor("#E00A0E2A")
             c.drawCircle(cx, cy, w * 0.49f, p)
             p.style = Paint.Style.STROKE
             p.strokeWidth = w * 0.018f
             p.shader = LinearGradient(0f, 0f, w, h, Color.parseColor("#8B3CF0"), Color.parseColor("#2F6BFF"), Shader.TileMode.CLAMP)
             c.drawCircle(cx, cy, w * 0.48f, p)
             val r = w * 0.37f
             val sw = w * 0.04f
             arc(c, cx, cy, r, sw, -85f, 77f, Color.parseColor("#3FE0FF"))
             arc(c, cx, cy, r, sw, 8f, 77f, Color.parseColor("#2BB6F0"))
             arc(c, cx, cy, r, sw, 95f, 77f, Color.parseColor("#B44CFF"))
             arc(c, cx, cy, r, sw, 188f, 77f, Color.parseColor("#D058FF"))
             play(c, cx, cy, w * 0.44f)
            } else {
             val rad = w * 0.22f
             box.set(0f, 0f, w, h)
             p.reset()
             p.isAntiAlias = true
             p.color = Color.parseColor("#070A1E")
             c.drawRoundRect(box, rad, rad, p)
             clip.reset()
             clip.addRoundRect(box, rad, rad, Path.Direction.CW)
             c.save()
             c.clipPath(clip)
             path.reset()
             path.moveTo(0f, 0f)
             path.lineTo(w, 0f)
             path.quadTo(w * 0.55f, h * 0.1f, w * 0.25f, h * 0.38f)
             path.quadTo(w * 0.08f, h * 0.55f, 0f, h * 0.62f)
             path.close()
             p.color = Color.parseColor("#467C3AED")
             c.drawPath(path, p)
             path.reset()
             path.moveTo(w, h)
             path.lineTo(0f, h)
             path.quadTo(w * 0.45f, h * 0.9f, w * 0.75f, h * 0.65f)
             path.quadTo(w * 0.95f, h * 0.48f, w, h * 0.4f)
             path.close()
             p.color = Color.parseColor("#502F6BFF")
             c.drawPath(path, p)
             c.restore()
             // neon border
             p.reset()
             p.isAntiAlias = true
             p.style = Paint.Style.STROKE
             p.strokeWidth = w * 0.022f
             p.shader = LinearGradient(0f, 0f, w, h, Color.parseColor("#D25BFF"), Color.parseColor("#3DA0FF"), Shader.TileMode.CLAMP)
             box.set(w * 0.011f, w * 0.011f, w - w * 0.011f, h - w * 0.011f)
             c.drawRoundRect(box, rad, rad, p)
             // ring with a small gap at the top
             val r = w * 0.345f
             val sw = w * 0.032f
             box.set(cx - r, cy - r, cx + r, cy + r)
             p.reset()
             p.isAntiAlias = true
             p.style = Paint.Style.STROKE
             p.strokeCap = Paint.Cap.ROUND
             p.strokeWidth = sw
             p.shader = SweepGradient(
              cx, cy,
              intArrayOf(Color.parseColor("#2DE2FF"), Color.parseColor("#3B82F6"), Color.parseColor("#A64CFF"), Color.parseColor("#D050FF"), Color.parseColor("#2DE2FF"), Color.parseColor("#2DE2FF")),
              floatArrayOf(0f, 0.25f, 0.5f, 0.74f, 0.76f, 1f)
             )
             c.drawArc(box, -80f, 340f, false, p)
             play(c, cx, cy, w * 0.42f)
            }
           }
          }

          class MenuActivity : Activity() {


           private fun dp(x: Int) = Ui.dp(this, x)

           private fun tv(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
            val t = TextView(this)
            t.text = s
            t.textSize = size
            t.setTextColor(color)
            if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
            return t
