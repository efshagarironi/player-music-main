          // small line icons of the play list page, drawn on a 24 x 24 grid
          class QIcon(ctx: Context, var kind: Int) : View(ctx) {
           var color = Color.WHITE
            set(v) {
             field = v
             invalidate()
            }
           private val p = Paint(Paint.ANTI_ALIAS_FLAG)
           private val path = Path()

           fun set(k: Int) {
            if (kind != k) {
             kind = k
             invalidate()
            }
           }

           override fun onDraw(c: Canvas) {
            val s = Math.min(width, height).toFloat()
            if (s <= 0f) return
            c.save()
            c.translate((width - s) / 2f, (height - s) / 2f)
            c.scale(s / 24f, s / 24f)
            p.color = color
            p.strokeCap = Paint.Cap.ROUND
            p.strokeJoin = Paint.Join.ROUND
            p.strokeWidth = 2f
            p.style = Paint.Style.STROKE
            when (kind) {
             0 -> { // back arrow
              c.drawLine(20f, 12f, 5f, 12f, p)
              c.drawLine(11f, 5.5f, 4.5f, 12f, p)
              c.drawLine(11f, 18.5f, 4.5f, 12f, p)
             }
             1 -> { // list view: a square and a line, three times
              for (i in 0..2) {
               val y = 5.5f + i * 6.5f
               c.drawRect(3.2f, y - 1.8f, 6.8f, y + 1.8f, p)
               c.drawLine(10.5f, y, 21f, y, p)
              }
             }
             2 -> { // three dots
              p.style = Paint.Style.FILL
              c.drawCircle(12f, 5f, 2f, p)
              c.drawCircle(12f, 12f, 2f, p)
              c.drawCircle(12f, 19f, 2f, p)
             }
             3 -> { // close
              c.drawLine(6f, 6f, 18f, 18f, p)
              c.drawLine(18f, 6f, 6f, 18f, p)
             }
             4 -> { // add to list: lines and a plus in a circle
              c.drawLine(3f, 6f, 15f, 6f, p)
              c.drawLine(3f, 11f, 15f, 11f, p)
              c.drawLine(3f, 16f, 9f, 16f, p)
              p.strokeWidth = 1.7f
              c.drawCircle(17.5f, 16.5f, 5f, p)
              c.drawLine(17.5f, 14f, 17.5f, 19f, p)
              c.drawLine(15f, 16.5f, 20f, 16.5f, p)
             }
             5 -> { // select all
              c.drawRoundRect(RectF(3.5f, 3.5f, 20.5f, 20.5f), 3f, 3f, p)
             }
             6 -> { // drag handle: short dashes
              p.strokeWidth = 1.6f
              p.strokeCap = Paint.Cap.BUTT
              for (r in 0..2) {
               val y = 6f + r * 6f
               c.drawLine(2f, y, 6.2f, y, p)
               c.drawLine(9.9f, y, 14.1f, y, p)
               c.drawLine(17.8f, y, 22f, y, p)
              }
             }
             7 -> { // check
              p.strokeWidth = 2.6f
              path.reset()
              path.moveTo(5f, 12.8f)
              path.lineTo(10f, 17.6f)
              path.lineTo(19f, 7f)
              c.drawPath(path, p)
             }
             8 -> { // previous
              p.style = Paint.Style.FILL
              c.drawRect(4.5f, 5f, 7f, 19f, p)
              path.reset()
              path.moveTo(20f, 5f)
              path.lineTo(9f, 12f)
              path.lineTo(20f, 19f)
              path.close()
              c.drawPath(path, p)
             }
             9 -> { // next
              p.style = Paint.Style.FILL
              c.drawRect(17f, 5f, 19.5f, 19f, p)
              path.reset()
              path.moveTo(4f, 5f)
              path.lineTo(15f, 12f)
              path.lineTo(4f, 19f)
              path.close()
              c.drawPath(path, p)
             }
             10 -> { // pause
              p.style = Paint.Style.FILL
              c.drawRect(5.5f, 4f, 10.2f, 20f, p)
              c.drawRect(13.8f, 4f, 18.5f, 20f, p)
             }
             else -> { // play
              p.style = Paint.Style.FILL
              path.reset()
              path.moveTo(7f, 4f)
              path.lineTo(20f, 12f)
              path.lineTo(7f, 20f)
              path.close()
              c.drawPath(path, p)
             }
            }
            c.restore()
           }
          }

          // thin progress line on top of the small player
          class QProgress(ctx: Context) : View(ctx) {
           var frac = 0f
            set(v) {
             field = v
             invalidate()
            }
           private val p = Paint()

           override fun onDraw(c: Canvas) {
            p.color = Color.argb(60, 255, 255, 255)
            c.drawRect(0f, 0f, width.toFloat(), height.toFloat(), p)
            p.color = Color.parseColor("#8B63E6")
            c.drawRect(0f, 0f, width * frac.coerceIn(0f, 1f), height.toFloat(), p)
           }
          }

          // covers of the songs in the list (small pictures, kept in memory)
          object QCovers {
           private val cache = LruCache<String, Bitmap>(90)
           private val miss = HashSet<String>()
           private val pool = Executors.newFixedThreadPool(2)
           private val ui = Handler(Looper.getMainLooper())

           fun peek(t: Track): Bitmap? = cache.get(t.key)

           fun load(ctx: Context, t: Track, cb: (Bitmap?) -> Unit) {
            val c = cache.get(t.key)
            if (c != null) {
             cb(c)
             return
            }
            val known = synchronized(miss) { miss.contains(t.key) }
            if (known) {
             cb(null)
             return
            }
            val app = ctx.applicationContext
            try {
             pool.execute {
              var bm: Bitmap? = null
              if (Build.VERSION.SDK_INT >= 29 && t.uri.scheme == "content") {
               try {
                bm = app.contentResolver.loadThumbnail(t.uri, Size(256, 256), null)
               } catch (e: Throwable) {
               }
              }
              if (bm == null) {
               val r = MediaMetadataRetriever()
               try {
                r.setDataSource(app, t.uri)
                val b = r.embeddedPicture
                if (b != null) {
                 val o = android.graphics.BitmapFactory.Options()
                 o.inJustDecodeBounds = true
                 android.graphics.BitmapFactory.decodeByteArray(b, 0, b.size, o)
                 var sm = 1
                 while (o.outWidth / sm > 400) sm *= 2
                 val o2 = android.graphics.BitmapFactory.Options()
                 o2.inSampleSize = sm
                 bm = android.graphics.BitmapFactory.decodeByteArray(b, 0, b.size, o2)
                }
               } catch (e: Throwable) {
               } finally {
                try {
                 r.release()
                } catch (e: Throwable) {
                }
               }
              }
              if (bm != null) cache.put(t.key, bm) else synchronized(miss) { miss.add(t.key) }
              val out = bm
              ui.post { cb(out) }
             }
            } catch (e: Throwable) {
            }
           }
          }

          // The play list page (the list of songs that are playing / will play): drag handle, cover, title, artist - album,
          // number + length, a menu per song, long press = selection mode, small player at the bottom.
          class QueuePanel(private val act: Activity) {
           val root = LinearLayout(act)
           private val MP = ViewGroup.LayoutParams.MATCH_PARENT
           private val WC = ViewGroup.LayoutParams.WRAP_CONTENT
           private val accent = Color.parseColor("#8B63E6")
           private val barBg = Ui.MUS_HDR
           private val miniBg = Color.parseColor("#2B1B4A")
           private val dim = Color.argb(185, 255, 255, 255)
           private val sp = act.getSharedPreferences("browser", Context.MODE_PRIVATE)

           private var rows: List<Track> = emptyList()
           private var curPos = -1
           private val sel = LinkedHashSet<String>()
           private var selMode = false
           private var compact = sp.getBoolean("q_compact", false)
           private var dragging = false

           private lateinit var titleTv: TextView
           private lateinit var subTv: TextView
           private lateinit var selBar: LinearLayout
           private lateinit var selCount: TextView
           private lateinit var list: RecyclerView
           private lateinit var adapter: Adapter
           private lateinit var helper: ItemTouchHelper
           private lateinit var viewIcon: QIcon
           private lateinit var mProg: QProgress
           private lateinit var mImg: ImageView
           private lateinit var mTitle: TextView
           private lateinit var mSub: TextView
           private lateinit var mBadge: TextView
           private lateinit var mPlay: QIcon
           private var mKey = ""

           val visible: Boolean get() = root.visibility == View.VISIBLE

           private fun dp(x: Int): Int = Ui.dp(act, x)

           private fun fa(s: String): String {
            val sb = StringBuilder()
            for (ch in s) {
             if (ch in '0'..'9') sb.append('\u06F0' + (ch - '0')) else sb.append(ch)
            }
            return sb.toString()
           }

           private fun tv(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
            val t = TextView(act)
            t.text = s
            t.textSize = size
            t.setTextColor(color)
            if (bold) t.setTypeface(t.typeface, android.graphics.Typeface.BOLD)
            t.textAlignment = View.TEXT_ALIGNMENT_VIEW_START
            return t
           }

           private fun icon(kind: Int, boxW: Int, boxH: Int, pad: Int, onClick: () -> Unit): QIcon {
            val ic = QIcon(act, kind)
            ic.setPadding(dp(pad), dp(pad), dp(pad), dp(pad))
            ic.setOnClickListener { onClick() }
            ic.layoutParams = LinearLayout.LayoutParams(dp(boxW), dp(boxH))
            return ic
           }

           init {
            root.orientation = LinearLayout.VERTICAL
            root.layoutDirection = View.LAYOUT_DIRECTION_LTR
            root.background = Ui.musicPageBg()
            root.visibility = View.GONE
            root.isClickable = true
            build()
           }

           // ------------------------------------------------------------------ build
           private fun build() {
            val sbId = act.resources.getIdentifier("status_bar_height", "dimen", "android")
            val sbH = if (sbId > 0) act.resources.getDimensionPixelSize(sbId) else dp(24)

            // header: back, title + "[N songs, time]", list look, menu
            val head = LinearLayout(act)
            head.orientation = LinearLayout.HORIZONTAL
            head.gravity = Gravity.CENTER_VERTICAL
            head.setBackgroundColor(barBg)
            head.elevation = dp(6).toFloat()
            head.setPadding(dp(8), sbH + dp(6), dp(6), dp(8))
            head.addView(icon(0, 48, 52, 12) { hide() })
            val col = LinearLayout(act)
            col.orientation = LinearLayout.VERTICAL
            titleTv = tv("لیست پخش", 20f, Ui.TEXT, true)
            titleTv.setPadding(dp(6), 0, 0, 0)
            subTv = tv("", 14f, Ui.MUTED)
            subTv.setPadding(dp(6), 0, 0, 0)
            col.addView(titleTv)
            col.addView(subTv)
            head.addView(col, LinearLayout.LayoutParams(0, WC, 1f))
            viewIcon = icon(1, 48, 52, 12) { toggleCompact() }
            head.addView(viewIcon)
            head.addView(icon(2, 44, 52, 12) { headerMenu() })
            root.addView(head, LinearLayout.LayoutParams(MP, WC))

            // selection bar (long press): more, remove, add to list | count, select all, close
            selBar = LinearLayout(act)
            selBar.orientation = LinearLayout.HORIZONTAL
            selBar.gravity = Gravity.CENTER_VERTICAL
            selBar.setBackgroundColor(barBg)
            selBar.elevation = dp(5).toFloat()
            selBar.setPadding(dp(8), dp(2), dp(6), dp(8))
            selBar.visibility = View.GONE
            selBar.addView(icon(2, 44, 48, 12) { selMenu() })
            selBar.addView(icon(3, 48, 48, 12) { removeSelected() })
            selBar.addView(icon(4, 48, 48, 12) { addSelectedToList() })
            selBar.addView(View(act), LinearLayout.LayoutParams(0, 1, 1f))
            selCount = tv("0", 18f, Ui.TEXT)
            selCount.gravity = Gravity.CENTER
            selBar.addView(selCount, LinearLayout.LayoutParams(WC, dp(48)))
            selBar.addView(icon(5, 48, 48, 13) { selectAllToggle() })
            selBar.addView(icon(3, 48, 48, 12) { exitSel() })
            root.addView(selBar, LinearLayout.LayoutParams(MP, WC))

            // the list
            list = RecyclerView(act)
            list.layoutManager = LinearLayoutManager(act)
            list.itemAnimator = null
            list.clipToPadding = false
            list.setPadding(0, dp(2), 0, dp(8))
            adapter = Adapter()
            list.adapter = adapter
            helper = ItemTouchHelper(object : ItemTouchHelper.SimpleCallback(ItemTouchHelper.UP or ItemTouchHelper.DOWN, 0) {
             override fun isLongPressDragEnabled(): Boolean = false

             override fun onMove(rv: RecyclerView, vh: RecyclerView.ViewHolder, target: RecyclerView.ViewHolder): Boolean {
              val a = vh.bindingAdapterPosition
              val b = target.bindingAdapterPosition
              if (a < 0 || b < 0 || a >= rows.size || b >= rows.size) return false
              val l = ArrayList<Track>(rows)
              val x = l.removeAt(a)
              l.add(b, x)
              rows = l
              MusicService.moveInOrder(a, b)
              curPos = MusicService.pos
              adapter.notifyItemMoved(a, b)
              return true
             }

             override fun onSwiped(vh: RecyclerView.ViewHolder, direction: Int) {}

             override fun onSelectedChanged(vh: RecyclerView.ViewHolder?, state: Int) {
              super.onSelectedChanged(vh, state)
              if (state == ItemTouchHelper.ACTION_STATE_DRAG) {
               dragging = true
               vh?.itemView?.setBackgroundColor(Color.argb(150, 70, 45, 120))
               vh?.itemView?.elevation = dp(8).toFloat()
              }
             }

             override fun clearView(rv: RecyclerView, vh: RecyclerView.ViewHolder) {
              super.clearView(rv, vh)
              vh.itemView.setBackgroundColor(Color.TRANSPARENT)
              vh.itemView.elevation = 0f
              dragging = false
              adapter.notifyDataSetChanged()
              MusicService.onChange?.invoke()
             }
            })
            helper.attachToRecyclerView(list)
            root.addView(list, LinearLayout.LayoutParams(MP, 0, 1f))

            // small player: progress line, cover, title, artist . album, n/total, previous, play / pause, next
            val mini = LinearLayout(act)
            mini.orientation = LinearLayout.VERTICAL
            mini.setBackgroundColor(miniBg)
            mini.elevation = dp(6).toFloat()
            mProg = QProgress(act)
            mini.addView(mProg, LinearLayout.LayoutParams(MP, dp(2)))
            val mr = LinearLayout(act)
            mr.orientation = LinearLayout.HORIZONTAL
            mr.gravity = Gravity.CENTER_VERTICAL
            mr.setPadding(dp(6), dp(6), dp(4), dp(6))
            mImg = ImageView(act)
            mImg.scaleType = ImageView.ScaleType.CENTER_CROP
            mImg.setBackgroundColor(Color.parseColor("#1F1236"))
            Ui.roundClip(mImg, 8)
            mr.addView(mImg, LinearLayout.LayoutParams(dp(56), dp(56)))
            val mc = LinearLayout(act)
            mc.orientation = LinearLayout.VERTICAL
            mc.setPadding(dp(12), 0, dp(6), 0)
            mTitle = tv("", 16f, Ui.TEXT, true)
            mTitle.maxLines = 1
            mTitle.ellipsize = TextUtils.TruncateAt.END
            mSub = tv("", 14f, Ui.MUTED)
            mSub.maxLines = 1
            mSub.ellipsize = TextUtils.TruncateAt.END
            mc.addView(mTitle)
            mc.addView(mSub)
            mr.addView(mc, LinearLayout.LayoutParams(0, WC, 1f))
            mBadge = tv("", 13f, Ui.TEXT, true)
            mBadge.gravity = Gravity.CENTER
            mBadge.setPadding(dp(8), dp(4), dp(8), dp(4))
            mBadge.background = Ui.rect(act, Color.argb(80, 255, 255, 255), 6)
            val bl = LinearLayout.LayoutParams(WC, WC)
            bl.rightMargin = dp(8)
            mr.addView(mBadge, bl)
            mr.addView(icon(8, 46, 48, 12) { MusicService.inst?.prev() })
            mPlay = icon(10, 50, 48, 11) { MusicService.toggleOrStart(act) }
            mr.addView(mPlay)
            mr.addView(icon(9, 46, 48, 12) { MusicService.inst?.next(true) })
            mini.addView(mr)
            mini.setOnClickListener { hide() }
            root.addView(mini, LinearLayout.LayoutParams(MP, WC))
           }

           // ------------------------------------------------------------------ show / hide / state
           fun show() {
            exitSel()
            readQueue()
            adapter.notifyDataSetChanged()
            root.visibility = View.VISIBLE
            updateHeader()
            updateMini()
            scrollToCurrent()
           }

           fun hide() {
            if (selMode) exitSel()
            root.visibility = View.GONE
           }

           // back key: first closes the selection, then the page
           fun handleBack(): Boolean {
            if (!visible) return false
            if (selMode) {
             exitSel()
            } else {
             hide()
            }
            return true
           }

           private fun scrollToCurrent() {
            if (curPos < 0) return
            list.post {
             val lm = list.layoutManager as? LinearLayoutManager
             lm?.scrollToPositionWithOffset(curPos, dp(90))
            }
           }

           private fun readQueue() {
            val q = MusicService.queue
            val o = MusicService.order
            val l = ArrayList<Track>()
            if (o.size == q.size) {
             for (k in o) if (k >= 0 && k < q.size) l.add(q[k])
            }
            rows = l
            curPos = if (l.isEmpty()) -1 else MusicService.pos
            // songs that left the list leave the selection too
            val keys = HashSet<String>()
            for (t in l) keys.add(t.key)
            sel.retainAll(keys)
            if (selMode && sel.isEmpty()) {
             selMode = false
             selBar.visibility = View.GONE
            }
           }

           // called whenever the player changes
           fun refresh() {
            if (!visible || dragging) return
            val oldKeys = rows.map { it.key }
            val oldPos = curPos
            readQueue()
            val same = oldKeys.size == rows.size && oldKeys.indices.all { oldKeys[it] == rows[it].key }
            if (!same) {
             adapter.notifyDataSetChanged()
            } else if (oldPos != curPos) {
             if (oldPos in rows.indices) adapter.notifyItemChanged(oldPos)
             if (curPos in rows.indices) adapter.notifyItemChanged(curPos)
            }
            updateHeader()
            updateMini()
            if (selMode) selCount.text = fa(sel.size.toString())
           }

           fun progress() {
            if (!visible) return
            val s = MusicService.inst ?: return
            val d = s.duration()
            mProg.frac = if (d > 0) s.position().toFloat() / d else 0f
           }

           private fun updateHeader() {
            var total = 0L
            for (t in rows) total += t.duration
            subTv.text = "[" + fa(rows.size.toString()) + " آهنگ، " + fa(Ui.dur(total)) + "]"
            viewIcon.alpha = if (compact) 0.6f else 1f
           }

           private fun updateMini() {
            val t = MusicService.current() ?: return
            mTitle.text = t.title
            mSub.text = (if (t.artist.isBlank()) "ناشناس" else t.artist) + (if (t.album.isNotBlank()) " • " + t.album else "")
            mBadge.text = fa((curPos + 1).toString()) + "/" + fa(rows.size.toString())
            val s = MusicService.inst
            val playing = s != null && (s.isPlaying() || s.loading())
            mPlay.set(if (playing) 10 else 11)
            if (mKey != t.key) {
             mKey = t.key
             mImg.setImageResource(R.drawable.ic_music_fab)
             mImg.scaleType = ImageView.ScaleType.CENTER_INSIDE
             mImg.setPadding(dp(10), dp(10), dp(10), dp(10))
             val key = t.key
             QCovers.load(act, t) { b ->
              if (b != null && mKey == key) {
               mImg.setPadding(0, 0, 0, 0)
               mImg.scaleType = ImageView.ScaleType.CENTER_CROP
               mImg.setImageBitmap(b)
              }
             }
            }
           }

           private fun toggleCompact() {
            compact = !compact
            sp.edit().putBoolean("q_compact", compact).apply()
            updateHeader()
            adapter.notifyDataSetChanged()
           }

           // ------------------------------------------------------------------ selection
           private fun enterSel(key: String) {
            selMode = true
            sel.clear()
            sel.add(key)
            selBar.visibility = View.VISIBLE
            selCount.text = fa(sel.size.toString())
            adapter.notifyDataSetChanged()
           }

           private fun toggleSel(key: String) {
            if (!sel.remove(key)) sel.add(key)
            if (sel.isEmpty()) {
             exitSel()
             return
            }
            selCount.text = fa(sel.size.toString())
            adapter.notifyDataSetChanged()
           }

           private fun exitSel() {
            val was = selMode
            selMode = false
            sel.clear()
            if (::selBar.isInitialized) selBar.visibility = View.GONE
            if (was && ::adapter.isInitialized) adapter.notifyDataSetChanged()
           }

           private fun selectAllToggle() {
            if (sel.size == rows.size) {
             exitSel()
            } else {
             for (t in rows) sel.add(t.key)
             selCount.text = fa(sel.size.toString())
             adapter.notifyDataSetChanged()
            }
           }

           private fun selTracks(): List<Track> = rows.filter { sel.contains(it.key) }

           private fun positionsOf(keys: Set<String>): Set<Int> {
            val ps = HashSet<Int>()
            for (k in rows.indices) if (keys.contains(rows[k].key)) ps.add(k)
            return ps
           }

           // ------------------------------------------------------------------ actions
           private fun removeKeys(keys: Set<String>) {
            val ps = positionsOf(keys)
            if (ps.isEmpty()) return
            val removedCur = MusicService.removeFromOrder(ps)
            MusicService.inst?.afterEdit(removedCur)
            exitSel()
            if (MusicService.queue.isEmpty()) {
             hide()
             return
            }
            readQueue()
            adapter.notifyDataSetChanged()
            updateHeader()
            updateMini()
           }

           private fun removeSelected() {
            if (sel.isEmpty()) return
            removeKeys(HashSet(sel))
           }

           private fun playNextKeys(keys: Set<String>) {
            val ps = positionsOf(keys)
            if (ps.isEmpty()) return
            MusicService.moveAfterCurrent(ps)
            exitSel()
            readQueue()
            adapter.notifyDataSetChanged()
            updateMini()
            Toast.makeText(act, "بعد از آهنگ فعلی پخش می‌شود", Toast.LENGTH_SHORT).show()
           }

           private fun headerMenu() {
            val names = arrayOf("ذخیره به‌عنوان لیست پخش", "انتخاب همه", "رفتن به آهنگ در حال پخش", "پاک کردن لیست پخش")
            AlertDialog.Builder(act)
             .setItems(names) { _, w ->
              if (w == 0) {
               chooseTarget(rows)
              } else if (w == 1) {
               if (rows.isNotEmpty()) {
                selMode = true
                sel.clear()
                for (t in rows) sel.add(t.key)
                selBar.visibility = View.VISIBLE
                selCount.text = fa(sel.size.toString())
                adapter.notifyDataSetChanged()
               }
              } else if (w == 2) {
               scrollToCurrent()
              } else {
               AlertDialog.Builder(act)
                .setMessage("همهٔ آهنگ‌ها از لیست پخش پاک شوند؟ (پخش متوقف می‌شود)")
                .setPositiveButton("پاک کردن") { _, _ ->
                 val all = HashSet<String>()
                 for (t in rows) all.add(t.key)
                 removeKeys(all)
                }
                .setNegativeButton("لغو", null)
                .show()
              }
             }
             .show()
           }

           private fun selMenu() {
            val names = arrayOf("پخش بعدی", "انتخاب همه", "حذف از لیست پخش")
            AlertDialog.Builder(act)
             .setItems(names) { _, w ->
              if (w == 0) playNextKeys(HashSet(sel)) else if (w == 1) selectAllToggle() else removeSelected()
             }
             .show()
           }

           private fun rowMenu(t: Track) {
            val names = arrayOf("پخش بعدی", "افزودن به لیست پخش", "حذف از لیست پخش")
            AlertDialog.Builder(act)
             .setTitle(t.title)
             .setItems(names) { _, w ->
              if (w == 0) playNextKeys(hashSetOf(t.key)) else if (w == 1) chooseTarget(listOf(t)) else removeKeys(hashSetOf(t.key))
             }
             .show()
           }

           private fun addSelectedToList() {
            val tl = selTracks()
            if (tl.isEmpty()) return
            chooseTarget(tl)
           }

           // ------------------------------------------------------------------ saved lists (same storage as the playlist page)
           private fun prefName(shared: Boolean) = if (shared) "playlists_music_shared" else "playlists_music"

           private fun loadLists(shared: Boolean): JSONArray = try {
            JSONArray(act.getSharedPreferences(prefName(shared), Context.MODE_PRIVATE).getString("data", "[]"))
           } catch (e: Throwable) {
            JSONArray()
           }

           private fun trackJson(t: Track): JSONObject {
            val o = JSONObject()
            o.put("u", t.key)
            o.put("t", t.title)
            o.put("d", t.duration)
            if (t.artist.isNotBlank()) o.put("a", t.artist)
            return o
           }

           private fun saveNew(shared: Boolean, name: String, tl: List<Track>) {
            val old = loadLists(shared)
            val arr = JSONArray()
            val o = JSONObject()
            o.put("id", System.currentTimeMillis())
            o.put("name", name)
            val items = JSONArray()
            val have = HashSet<String>()
            for (t in tl) if (have.add(t.key)) items.put(trackJson(t))
            o.put("items", items)
            arr.put(o)
            for (i in 0 until old.length()) arr.put(old.get(i))
            act.getSharedPreferences(prefName(shared), Context.MODE_PRIVATE).edit().putString("data", arr.toString()).apply()
            Toast.makeText(act, fa(items.length().toString()) + " آهنگ به «" + name + "» اضافه شد", Toast.LENGTH_SHORT).show()
            exitSel()
           }

           private fun addToExisting(shared: Boolean, idx: Int, tl: List<Track>) {
            val arr = loadLists(shared)
            if (idx < 0 || idx >= arr.length()) return
            val o = arr.getJSONObject(idx)
            val items = o.getJSONArray("items")
            val have = HashSet<String>()
            for (i in 0 until items.length()) have.add(items.getJSONObject(i).optString("u"))
            var n = 0
            for (t in tl) {
             if (have.add(t.key)) {
              items.put(trackJson(t))
              n++
             }
            }
            act.getSharedPreferences(prefName(shared), Context.MODE_PRIVATE).edit().putString("data", arr.toString()).apply()
            Toast.makeText(act, fa(n.toString()) + " آهنگ به «" + o.optString("name") + "» اضافه شد", Toast.LENGTH_SHORT).show()
            exitSel()
           }

           // first the choice: a new list or one of my lists; "new" opens the name dialog
           fun chooseTarget(tl: List<Track>) {
            if (tl.isEmpty()) return
            val mine = loadLists(false)
            val names = ArrayList<String>()
            names.add("＋  لیست پخش جدید")
            for (i in 0 until mine.length()) names.add(mine.getJSONObject(i).optString("name"))
            AlertDialog.Builder(act)
             .setTitle("افزودن " + fa(tl.size.toString()) + " آهنگ به لیست پخش")
             .setItems(names.toTypedArray()) { _, w ->
              if (w == 0) askName(tl) else addToExisting(false, w - 1, tl)
             }
             .show()
           }

           private fun nextName(shared: Boolean): String {
            val arr = loadLists(shared)
            val used = HashSet<String>()
            for (i in 0 until arr.length()) used.add(arr.getJSONObject(i).optString("name"))
            var n = 1
            while (used.contains("لیست پخش جدید " + fa(n.toString()))) n++
            return "لیست پخش جدید " + fa(n.toString())
           }

           // "Playlist name" dialog: tabs shared / my lists, a name field with a clear button, cancel / save
           private fun askName(tl: List<Track>) {
            val dlg = Dialog(act)
            dlg.requestWindowFeature(Window.FEATURE_NO_TITLE)
            val card = LinearLayout(act)
            card.orientation = LinearLayout.VERTICAL
            card.layoutDirection = View.LAYOUT_DIRECTION_LTR
            card.background = Ui.rect(act, Color.parseColor("#2B1C4A"), 16)

            val title = tv("نام لیست پخش", 21f, Ui.TEXT, true)
            title.gravity = Gravity.CENTER
            title.textAlignment = View.TEXT_ALIGNMENT_CENTER
            title.setPadding(dp(20), dp(24), dp(20), dp(18))
            card.addView(title, LinearLayout.LayoutParams(MP, WC))

            var shared = false
            val tabs = LinearLayout(act)
            tabs.orientation = LinearLayout.HORIZONTAL
            val tabNames = arrayOf("لیست‌های مشترک", "لیست‌های من")
            val tabViews = ArrayList<TextView>()
            val et = EditText(act)
            var auto = nextName(false)
            fun styleTabs() {
             for (i in 0..1) {
              val on = (i == 1) != shared
              val t = tabViews[i]
              t.setTextColor(Ui.TEXT)
              t.background = Ui.rect(act, if (on) Color.argb(70, 255, 255, 255) else Color.argb(18, 255, 255, 255), 6, Color.argb(90, 255, 255, 255), 1)
              t.setTypeface(null, if (on) android.graphics.Typeface.BOLD else android.graphics.Typeface.NORMAL)
             }
            }
            for (i in 0..1) {
             val t = tv(tabNames[i], 16f, Ui.TEXT, true)
             t.gravity = Gravity.CENTER
             t.textAlignment = View.TEXT_ALIGNMENT_CENTER
             t.setOnClickListener {
              val nowShared = i == 0
              if (nowShared != shared) {
               shared = nowShared
               // the suggested name follows the chosen set of lists, a name typed by hand stays
               if (et.text.toString() == auto) {
                auto = nextName(shared)
                et.setText(auto)
                et.setSelection(et.text.length)
               } else {
                auto = nextName(shared)
               }
               styleTabs()
              }
             }
             tabViews.add(t)
             tabs.addView(t, LinearLayout.LayoutParams(0, dp(48), 1f))
            }
            val tlp = LinearLayout.LayoutParams(MP, WC)
            tlp.setMargins(dp(20), 0, dp(20), 0)
            card.addView(tabs, tlp)
            styleTabs()

            val nameRow = LinearLayout(act)
            nameRow.orientation = LinearLayout.HORIZONTAL
            nameRow.gravity = Gravity.CENTER_VERTICAL
            et.setText(auto)
            et.setSingleLine(true)
            et.textSize = 20f
            et.setTextColor(Ui.TEXT)
            et.setTypeface(et.typeface, android.graphics.Typeface.BOLD)
            et.textAlignment = View.TEXT_ALIGNMENT_VIEW_START
            et.setBackgroundColor(Color.TRANSPARENT)
            et.setPadding(0, dp(10), 0, dp(10))
            et.setSelection(et.text.length)
            nameRow.addView(et, LinearLayout.LayoutParams(0, WC, 1f))
            val clr = QIcon(act, 3)
            clr.setPadding(dp(6), dp(6), dp(6), dp(6))
            clr.setOnClickListener { et.setText("") }
            nameRow.addView(clr, LinearLayout.LayoutParams(dp(34), dp(34)))
            val nlp = LinearLayout.LayoutParams(MP, WC)
            nlp.setMargins(dp(24), dp(36), dp(24), 0)
            card.addView(nameRow, nlp)
            val under = View(act)
            under.setBackgroundColor(accent)
            val ulp = LinearLayout.LayoutParams(MP, dp(2))
            ulp.setMargins(dp(24), 0, dp(24), 0)
            card.addView(under, ulp)

            val dv = View(act)
            dv.setBackgroundColor(Color.argb(40, 255, 255, 255))
            val dlp = LinearLayout.LayoutParams(MP, dp(1))
            dlp.topMargin = dp(34)
            card.addView(dv, dlp)

            val btns = LinearLayout(act)
            btns.orientation = LinearLayout.HORIZONTAL
            btns.gravity = Gravity.CENTER_VERTICAL
            btns.addView(View(act), LinearLayout.LayoutParams(0, 1, 1f))
            val cancel = tv("لغو", 17f, accent, true)
            cancel.setPadding(dp(22), dp(18), dp(22), dp(18))
            cancel.setOnClickListener { dlg.dismiss() }
            val save = tv("ذخیره", 17f, accent, true)
            save.setPadding(dp(22), dp(18), dp(26), dp(18))
            save.setOnClickListener {
             val n = et.text.toString().trim()
             if (n.isEmpty()) {
              Toast.makeText(act, "نام را وارد کن", Toast.LENGTH_SHORT).show()
             } else {
              dlg.dismiss()
              saveNew(shared, n, tl)
             }
            }
            btns.addView(cancel)
            btns.addView(save)
            card.addView(btns, LinearLayout.LayoutParams(MP, WC))

            dlg.setContentView(card)
            val w = dlg.window
            if (w != null) {
             w.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
             w.setLayout((act.resources.displayMetrics.widthPixels * 0.9f).toInt(), ViewGroup.LayoutParams.WRAP_CONTENT)
             w.setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_STATE_VISIBLE)
            }
            dlg.show()
            et.requestFocus()
           }

           // ------------------------------------------------------------------ rows
           private inner class VH(
            val v: View,
            val handle: View,
            val img: ImageView,
            val title: TextView,
            val l2a: TextView,
            val l2b: TextView,
            val badge: TextView,
            val dur: TextView,
            val menu: View,
            val info: View,
            val check: TextView
           ) : RecyclerView.ViewHolder(v)

           private fun styleCheck(t: TextView, on: Boolean) {
            val g = GradientDrawable()
            g.shape = GradientDrawable.OVAL
            if (on) {
             g.setColor(accent)
             t.text = "✓"
            } else {
             g.setColor(Color.argb(60, 0, 0, 0))
             t.text = ""
            }
            g.setStroke(dp(2), if (on) accent else Color.argb(200, 255, 255, 255))
            t.background = g
           }

           private inner class Adapter : RecyclerView.Adapter<VH>() {
            override fun getItemCount(): Int = rows.size

            override fun getItemViewType(position: Int): Int = if (compact) 1 else 0

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
             val small = viewType == 1
             val cov = if (small) dp(46) else dp(66)
             val vp = if (small) 5 else 8
             val wrap = LinearLayout(act)
             wrap.orientation = LinearLayout.VERTICAL
             wrap.layoutParams = RecyclerView.LayoutParams(MP, WC)

             val row = LinearLayout(act)
             row.orientation = LinearLayout.HORIZONTAL
             row.gravity = Gravity.CENTER_VERTICAL
             row.setPadding(dp(8), dp(vp), dp(4), dp(vp))

             val handle = QIcon(act, 6)
             handle.color = Color.argb(150, 255, 255, 255)
             handle.setPadding(dp(4), dp(10), dp(4), dp(10))
             row.addView(handle, LinearLayout.LayoutParams(dp(36), dp(44)))

             val img = ImageView(act)
             img.scaleType = ImageView.ScaleType.CENTER_CROP
             img.background = Ui.rect(act, Color.parseColor("#1F1236"), 8, Color.argb(70, 255, 255, 255), 1)
             Ui.roundClip(img, 8)
             val ilp = LinearLayout.LayoutParams(cov, cov)
             ilp.marginStart = dp(4)
             row.addView(img, ilp)

             val col = LinearLayout(act)
             col.orientation = LinearLayout.VERTICAL
             col.setPadding(dp(14), 0, dp(6), 0)
             val title = tv("", if (small) 15f else 17f, Ui.TEXT, true)
             title.maxLines = if (small) 1 else 2
             title.ellipsize = TextUtils.TruncateAt.END
             val l2 = LinearLayout(act)
             l2.orientation = LinearLayout.HORIZONTAL
             val l2a = tv("", if (small) 13f else 14.5f, dim, false)
             l2a.maxLines = 1
             l2a.ellipsize = TextUtils.TruncateAt.END
             val l2b = tv("", if (small) 13f else 14.5f, Color.argb(120, 255, 255, 255), false)
             l2b.maxLines = 1
             l2b.ellipsize = TextUtils.TruncateAt.END
             l2.addView(l2a, LinearLayout.LayoutParams(WC, WC))
             val bl = LinearLayout.LayoutParams(0, WC, 1f)
             bl.marginStart = dp(10)
             l2.addView(l2b, bl)
             col.addView(title)
             col.addView(l2)
             row.addView(col, LinearLayout.LayoutParams(0, WC, 1f))

             // number + length, then the menu (replaced by the check circle in the selection mode)
             val info = LinearLayout(act)
             info.orientation = LinearLayout.VERTICAL
             info.gravity = Gravity.CENTER_HORIZONTAL
             val badge = tv("", 13f, Ui.TEXT, true)
             badge.gravity = Gravity.CENTER
             badge.textAlignment = View.TEXT_ALIGNMENT_CENTER
             badge.setPadding(dp(7), dp(2), dp(7), dp(2))
             val dur = tv("", 12.5f, dim, false)
             dur.textAlignment = View.TEXT_ALIGNMENT_CENTER
             dur.gravity = Gravity.CENTER
             dur.setPadding(0, dp(4), 0, 0)
             info.addView(badge, LinearLayout.LayoutParams(WC, WC))
             info.addView(dur, LinearLayout.LayoutParams(WC, WC))
             row.addView(info, LinearLayout.LayoutParams(dp(52), WC))
             val menu = QIcon(act, 2)
             menu.color = Color.argb(200, 255, 255, 255)
             menu.setPadding(dp(8), dp(10), dp(8), dp(10))
             row.addView(menu, LinearLayout.LayoutParams(dp(36), dp(44)))

             val check = TextView(act)
             check.gravity = Gravity.CENTER
             check.textSize = 16f
             check.setTextColor(Color.WHITE)
             val clp = LinearLayout.LayoutParams(dp(34), dp(34))
             clp.setMargins(dp(8), 0, dp(14), 0)
             row.addView(check, clp)

             wrap.addView(row)
             val div = View(act)
             div.setBackgroundColor(Color.argb(38, 255, 255, 255))
             val dlp = LinearLayout.LayoutParams(MP, 1)
             dlp.marginStart = dp(48)
             wrap.addView(div, dlp)

             val vh = VH(wrap, handle, img, title, l2a, l2b, badge, dur, menu, info, check)
             wrap.setOnClickListener {
              val p = vh.bindingAdapterPosition
              if (p >= 0 && p < rows.size) {
               if (selMode) toggleSel(rows[p].key) else MusicService.inst?.jumpTo(p)
              }
             }
             wrap.setOnLongClickListener {
              val p = vh.bindingAdapterPosition
              if (p >= 0 && p < rows.size) {
               if (selMode) toggleSel(rows[p].key) else enterSel(rows[p].key)
              }
              true
             }
             menu.setOnClickListener {
              val p = vh.bindingAdapterPosition
              if (p >= 0 && p < rows.size) rowMenu(rows[p])
             }
             handle.setOnTouchListener { _, e ->
              if (e.actionMasked == MotionEvent.ACTION_DOWN) helper.startDrag(vh)
              false
             }
             return vh
            }

            override fun onBindViewHolder(h: VH, position: Int) {
             val t = rows[position]
             val isCur = position == curPos
             val picked = selMode && sel.contains(t.key)
             h.title.text = t.title
             h.l2a.text = (if (t.artist.isBlank()) "ناشناس" else t.artist) + (if (t.album.isNotBlank()) " - " + t.album else "")
             h.l2b.text = t.dir.substringAfterLast('/')
             h.l2b.visibility = if (compact) View.GONE else View.VISIBLE
             h.badge.text = fa((position + 1).toString())
             h.badge.background = Ui.rect(act, if (isCur) accent else Color.argb(70, 255, 255, 255), 6)
             h.dur.text = if (t.duration > 0L) fa(Ui.dur(t.duration)) else ""
             h.info.visibility = if (selMode) View.GONE else View.VISIBLE
             h.menu.visibility = if (selMode) View.GONE else View.VISIBLE
             h.check.visibility = if (selMode) View.VISIBLE else View.GONE
             styleCheck(h.check, picked)
             h.v.setBackgroundColor(if (picked) Color.argb(45, 139, 99, 230) else if (isCur) Color.argb(26, 255, 255, 255) else Color.TRANSPARENT)
             h.title.setTextColor(if (isCur) Color.parseColor("#C9B2FF") else Ui.TEXT)
             h.img.tag = t.key
             val cached = QCovers.peek(t)
             if (cached != null) {
              h.img.setPadding(0, 0, 0, 0)
              h.img.scaleType = ImageView.ScaleType.CENTER_CROP
              h.img.setImageBitmap(cached)
             } else {
              h.img.scaleType = ImageView.ScaleType.CENTER_INSIDE
              h.img.setPadding(dp(14), dp(14), dp(14), dp(14))
              h.img.setImageResource(R.drawable.ic_music_fab)
              h.img.alpha = 0.55f
              val key = t.key
              QCovers.load(act, t) { b ->
               if (b != null && h.img.tag == key) {
                h.img.alpha = 1f
                h.img.setPadding(0, 0, 0, 0)
                h.img.scaleType = ImageView.ScaleType.CENTER_CROP
                h.img.setImageBitmap(b)
               }
              }
             }
             if (cached != null) h.img.alpha = 1f
            }
           }
          }
          EOF

