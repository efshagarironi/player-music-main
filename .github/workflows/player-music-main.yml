            body.addView(group("آیکون ویدئوی بعدی", listOf(6, 7, 8)), lp(14))
            body.addView(group("آیکون تغییر اندازه تصویر (سمت راست آیکون بعدی)", listOf(11, 12, 13)), lp(14))
            body.addView(group("آیکون لیست تکرار (سمت چپ آیکون قبلی)", listOf(14, 15, 16)), lp(14))
            body.addView(group("آیکون ذخیره آخرین نقطه تماشا (سمت چپ لیست تکرار)", listOf(19, 20, 21)), lp(14))
            body.addView(group("آیکون چرخش صفحه (سمت راست تغییر اندازه تصویر)", listOf(23, 24, 25)), lp(14))
            body.addView(group("فاصله بین آیکون‌ها", listOf(9, 10, 17, 18, 22, 26)), lp(14))

            applyPreview()
            setContentView(root)
           }

           private fun group(title: String, idx: List<Int>): View {
            val card = LinearLayout(this)
            card.orientation = LinearLayout.VERTICAL
            card.setPadding(dp(16), dp(14), dp(16), dp(10))
            card.background = Ui.rect(this, Ui.CARD, 20, Ui.CARD_STROKE, 1)
            card.addView(tv(title, 15f, Ui.GREEN, true))
            for (i in idx) addSlider(card, i)
            return card
           }

           private fun addSlider(card: LinearLayout, i: Int) {
            val s = specs[i]
            val head = LinearLayout(this)
            head.orientation = LinearLayout.HORIZONTAL
            head.gravity = Gravity.CENTER_VERTICAL
            head.addView(tv(s.title, 14f, Ui.TEXT, true), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
            val value = tv(cur[i].toString(), 13f, Ui.GREEN, true)
            head.addView(value)
            card.addView(head, lp(12))
            card.addView(tv(s.sub, 11.5f, Ui.MUTED))

            val sb = SeekBar(this)
            sb.layoutDirection = View.LAYOUT_DIRECTION_LTR
            sb.progressTintList = ColorStateList.valueOf(Ui.GREEN)
            sb.thumbTintList = ColorStateList.valueOf(Ui.GREEN)
            sb.progressBackgroundTintList = ColorStateList.valueOf(Ui.CARD_STROKE)
            sb.max = s.max - s.min
            sb.progress = cur[i] - s.min
            sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
             override fun onProgressChanged(b: SeekBar?, p: Int, fromUser: Boolean) {
              cur[i] = p + s.min
              value.text = cur[i].toString()
              BarPrefs.set(this@BottomBarSettingsActivity, s, cur[i])
              applyPreview()
             }

             override fun onStartTrackingTouch(b: SeekBar?) {}
             override fun onStopTrackingTouch(b: SeekBar?) {}
            })
            card.addView(sb, lp(4))
            seekBars[i] = sb
            valueViews[i] = value
           }

           private fun resetAll() {
            BarPrefs.resetList(this, specs)
            for (i in specs.indices) {
             cur[i] = specs[i].def
             seekBars[i]?.progress = specs[i].def - specs[i].min
             valueViews[i]?.text = specs[i].def.toString()
            }
            applyPreview()
           }

           private fun applyPreview() {
            BarPrefs.applyBottom(this, prevV, playV, nextV, aspectV, repeatV, resumeV, rotV)
           }

           override fun finish() {
            super.finish()
            Nav.close(this)
           }
          }
