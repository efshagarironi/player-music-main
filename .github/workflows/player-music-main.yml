          package com.sharedl.app

          import android.app.admin.DeviceAdminReceiver
          import android.content.Context
          import android.content.Intent

          // "do not allow removing the player": while this administrator permission is active, Android refuses to uninstall the app.
          // The switch in the security page turns it off again, and that needs the right PIN / pattern or the fingerprint.
          class PlayerAdminReceiver : DeviceAdminReceiver() {
           override fun onDisableRequested(context: Context, intent: Intent): CharSequence {
            return "با غیرفعال کردن این مجوز، قفل حذف نصب پلیر برداشته می‌شود. برای ایمن ماندن، آن را از داخل برنامه (بخش امنیت) و با رمز، الگو یا اثر انگشت خاموش کن."
           }

           override fun onDisabled(context: Context, intent: Intent) {
            AppLock.setNoUninstall(context, false)
           }
          }
