          package com.sharedl.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock

          // "lock the uninstall screen": runs quietly in the background and notices when the system screen that confirms
          // removing an app (or the one that switches off a device administrator) comes to the front. It then shows the
          // PIN / pattern / fingerprint screen of this lock first. It needs "usage access" and "display over other apps";
          // no accessibility service. Nothing is stored or sent anywhere.
          class UninstallWatchService : Service() {
           private val h = Handler(Looper.getMainLooper())
           private var lastEvent = 0L

           private val tick = object : Runnable {
            override fun run() {
             if (!AppLock.uninstallGuard(this@UninstallWatchService)) {
              stopSelf()
              return
             }
             try {
              check()
             } catch (t: Throwable) {
             }
             h.postDelayed(this, 400L)
            }
           }

           override fun onBind(i: Intent?): IBinder? = null

           override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
            val ch = "uguard"
            if (Build.VERSION.SDK_INT >= 26) {
             val nm = getSystemService(NotificationManager::class.java)
             nm.createNotificationChannel(NotificationChannel(ch, "قفل صفحه حذف نصب", NotificationManager.IMPORTANCE_MIN))
            }
            val nb = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, ch) else Notification.Builder(this)
            nb.setSmallIcon(android.R.drawable.ic_lock_lock)
            nb.setContentTitle("قفل صفحه حذف نصب فعال است")
            nb.setOngoing(true)
            val n = nb.build()
            if (Build.VERSION.SDK_INT >= 34) {
             startForeground(7101, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
            } else {
             startForeground(7101, n)
            }
            lastEvent = System.currentTimeMillis()
            h.removeCallbacks(tick)
            h.post(tick)
            return START_STICKY
           }

           override fun onDestroy() {
            h.removeCallbacksAndMessages(null)
            super.onDestroy()
           }

           private fun guarded(cls: String): Boolean =
            cls.contains("UninstallerActivity") || cls.contains("DeviceAdminAdd") || cls.contains("DeviceAdminSettings")

           @Suppress("DEPRECATION")
           private fun check() {
            val um = getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
            val now = System.currentTimeMillis()
            val ev = um.queryEvents(lastEvent - 500L, now)
            val e = UsageEvents.Event()
            var hit = false
            var newest = lastEvent
            while (ev.hasNextEvent()) {
             ev.getNextEvent(e)
             if (e.timeStamp <= lastEvent) continue
             if (e.timeStamp > newest) newest = e.timeStamp
             if (e.eventType == UsageEvents.Event.MOVE_TO_FOREGROUND && guarded(e.className ?: "")) hit = true
            }
            lastEvent = newest
            if (!hit) return
            val t = SystemClock.elapsedRealtime()
            if (t < AppLock.guardUntil) return
            if (AppLock.guardShowing && t - AppLock.guardSince < 120000L) return
            AppLock.guardShowing = true
            AppLock.guardSince = t
            try {
             val i = Intent(this, LockActivity::class.java)
             i.putExtra("mode", "unlock")
             i.putExtra("sec", true)
             i.putExtra("slot", "ugd")
             i.putExtra("guard", true)
             i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_MULTIPLE_TASK or Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS or Intent.FLAG_ACTIVITY_NO_ANIMATION)
             startActivity(i)
            } catch (t2: Throwable) {
             AppLock.guardShowing = false
            }
           }
          }
