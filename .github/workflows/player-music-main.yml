             val slot = d(bottomSpecs[sizeIdx].slot)
             val diff = s - slot
             val half = diff / 2
             val p = LinearLayout.LayoutParams(s, s)
             p.marginStart = -half
             p.marginEnd = -(diff - half) + d(gapDp)
             p.topMargin = -half
             p.bottomMargin = -(diff - half)
             return p
