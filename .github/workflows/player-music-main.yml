name: Build ShareDL Player APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/sharedl/app
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/mipmap-anydpi app/src/main/res/anim app/src/main/res/xml
          echo '' | base64 -d > app/shared.p12

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ShareDLPlayer'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          def appVersionCode = Integer.parseInt((project.findProperty('vCode') ?: '1').toString())

          android {
              namespace 'com.sharedl.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.sharedl.player'
                  minSdk 24
                  targetSdk 34
                  versionCode = appVersionCode
                  versionName = '1.0'
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }

              signingConfigs {
                  shared {
                      storeFile file('shared.p12')
                      storePassword 'sharedl123'
                      keyAlias 'sharedl'
                      keyPassword 'sharedl123'
                      storeType 'pkcs12'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.shared
                  }
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
