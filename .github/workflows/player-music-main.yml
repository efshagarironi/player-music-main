           fun applyBottom(c: Context, prev: View, play: View, next: View, aspect: View, repeat: View, resume: View, rotate: View) {
            fun g(i: Int) = get(c, bottomSpecs[i])
            fun d(x: Int) = Ui.dp(c, x)
            // Each icon changes only its OWN drawn size. Its layout slot keeps the default
            // size (negative margins absorb the difference), so the other icons never move or resize.
            fun lpOf(sizeIdx: Int, gapDp: Int): LinearLayout.LayoutParams {
