                  <shape android:shape="rectangle">
                      <gradient
                          android:angle="315"
                          android:startColor="#1B0F4A"
                          android:centerColor="#070A1E"
                          android:endColor="#0B2A66" />
                      <corners android:radius="26dp" />
                  </shape>
              </item>
              <item android:drawable="@drawable/ic_player_fg" />
          </layer-list>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
              <monochrome android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <gradient
                          android:angle="270"
                          android:startColor="#FFFFFF"
                          android:endColor="#DDF7E6" />
                      <corners android:radius="26dp" />
                  </shape>
              </item>
              <item android:drawable="@drawable/ic_launcher_fg" />
          </layer-list>
