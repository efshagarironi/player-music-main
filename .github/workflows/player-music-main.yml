          // Backup of all app settings as one .json file in "ShareDL Backup" (created the first time a backup is made)
          object BackupStore {
           // settings files that are saved (lock / login sessions / watch history are not part of a backup)
           private val NAMES = arrayOf("browser", "prefs")
           private val SKIP = setOf("igCookie", "igLogin", "ytLogin")

           fun hasAccess(ctx: Context): Boolean {
            if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager()
            if (Build.VERSION.SDK_INT >= 23 && Build.VERSION.SDK_INT <= 28) {
             return ctx.checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
            }
            return true
           }

           fun askAccess(a: Activity) {
            if (Build.VERSION.SDK_INT >= 30) {
             AlertDialog.Builder(a)
              .setMessage("برای ساختن و خواندن نسخه پشتیبان در حافظه گوشی، اجازهٔ «دسترسی به همهٔ فایل‌ها» لازم است.")
              .setPositiveButton("تنظیمات") { _, _ ->
               try {
                a.startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + a.packageName)))
               } catch (e: Throwable) {
                try {
                 a.startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                } catch (e2: Throwable) {
                }
               }
              }
              .setNegativeButton("لغو", null)
              .show()
            } else if (Build.VERSION.SDK_INT >= 23) {
             a.requestPermissions(arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE), 71)
            }
           }

           private fun mainDir(): File = File(Environment.getExternalStorageDirectory(), "ShareDL Backup")

           private fun fallbackDir(ctx: Context): File = File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "ShareDL Backup")

           private fun targetDir(ctx: Context): File {
            val d = mainDir()
            if (hasAccess(ctx) && (d.isDirectory || d.mkdirs()) && d.canWrite()) return d
            val f = fallbackDir(ctx)
            f.mkdirs()
            return f
           }

           private fun entry(v: Any?): JSONObject? {
            val e = JSONObject()
            if (v is Boolean) {
             e.put("t", "b")
             e.put("v", v)
            } else if (v is Int) {
             e.put("t", "i")
             e.put("v", v.toLong())
            } else if (v is Long) {
             e.put("t", "l")
             e.put("v", v)
            } else if (v is Float) {
             e.put("t", "f")
             e.put("v", v.toDouble())
            } else if (v is String) {
             e.put("t", "s")
             e.put("v", v)
            } else if (v is Set<*>) {
             val a = JSONArray()
             for (x in v) a.put(x.toString())
             e.put("t", "set")
             e.put("v", a)
            } else {
             return null
            }
            return e
           }

           fun create(ctx: Context): File? {
            return try {
             val root = JSONObject()
             root.put("app", "ShareDL")
             root.put("v", 1)
             root.put("time", System.currentTimeMillis())
             val ps = JSONObject()
             for (n in NAMES) {
              val sp = ctx.getSharedPreferences(n, Context.MODE_PRIVATE)
              val o = JSONObject()
              for ((k, v) in sp.all) {
               if (n == "prefs" && SKIP.contains(k)) continue
               val e = entry(v) ?: continue
               o.put(k, e)
              }
              ps.put(n, o)
             }
             root.put("prefs", ps)
             val d = targetDir(ctx)
             val f = File(d, "backup_" + SimpleDateFormat("yyyy-MM-dd_HH-mm-ss", Locale.US).format(Date()) + ".json")
             f.writeText(root.toString(), Charsets.UTF_8)
             f
            } catch (e: Throwable) {
             null
            }
           }

           fun list(ctx: Context): ArrayList<File> {
            val out = ArrayList<File>()
            val dirs = arrayOf(mainDir(), fallbackDir(ctx))
            for (d in dirs) {
             val fs: Array<File>? = try {
              d.listFiles()
             } catch (e: Throwable) {
              null
             }
             if (fs == null) continue
             for (f in fs) if (f.isFile && f.name.startsWith("backup_") && f.name.endsWith(".json")) out.add(f)
            }
            out.sortByDescending { it.name }
            return out
           }

           fun restore(ctx: Context, f: File): Boolean {
            return try {
             val root = JSONObject(f.readText(Charsets.UTF_8))
             if (root.optString("app") != "ShareDL") return false
             val ps = root.getJSONObject("prefs")
             for (n in NAMES) {
              val o = ps.optJSONObject(n) ?: continue
              val sp = ctx.getSharedPreferences(n, Context.MODE_PRIVATE)
              val ed = sp.edit()
              for (k in sp.all.keys) {
               if (!(n == "prefs" && SKIP.contains(k))) ed.remove(k)
              }
              val ks = o.keys()
              while (ks.hasNext()) {
               val k = ks.next()
               val e = o.getJSONObject(k)
               when (e.getString("t")) {
                "b" -> ed.putBoolean(k, e.getBoolean("v"))
                "i" -> ed.putInt(k, e.getInt("v"))
                "l" -> ed.putLong(k, e.getLong("v"))
                "f" -> ed.putFloat(k, e.getDouble("v").toFloat())
                "s" -> ed.putString(k, e.getString("v"))
                "set" -> {
                 val a = e.getJSONArray("v")
                 val s = HashSet<String>()
                 for (i in 0 until a.length()) s.add(a.getString(i))
                 ed.putStringSet(k, s)
                }
               }
              }
              ed.commit()
             }
             true
            } catch (e: Throwable) {
             false
            }
           }
          }

          class BackupActivity : Activity() {

           private fun dp(x: Int) = Ui.dp(this, x)

           private fun tv(s: String, size: Float, color: Int, bold: Boolean = false): TextView {
            val t = TextView(this)
            t.text = s
            t.textSize = size
            t.setTextColor(color)
            if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
            return t
           }

           private fun option(title: String, sub: String, icon: String, top: Int, click: () -> Unit): LinearLayout {
            val item = LinearLayout(this)
            item.orientation = LinearLayout.HORIZONTAL
            item.gravity = Gravity.CENTER_VERTICAL
            item.setPadding(dp(16), dp(14), dp(16), dp(14))
            val bg = Ui.grad(this, Ui.CARD, Color.parseColor("#16294A"), 20)
            bg.setStroke(dp(1), Color.parseColor("#2F456B"))
            item.background = bg
            item.isClickable = true
            item.setOnClickListener { click() }
            val ic = tv(icon, 22f, Color.WHITE)
            ic.gravity = Gravity.CENTER
            ic.background = Ui.oval(Color.argb(60, 90, 130, 200))
            item.addView(ic, LinearLayout.LayoutParams(dp(48), dp(48)))
            val col = LinearLayout(this)
            col.orientation = LinearLayout.VERTICAL
            col.setPaddingRelative(dp(12), 0, dp(8), 0)
            col.addView(tv(title, 16f, Ui.TEXT, true))
            val s = tv(sub, 12f, Ui.MUTED)
            s.setPadding(0, dp(3), 0, 0)
            col.addView(s)
            item.addView(col, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
            item.addView(tv("‹", 28f, Ui.MUTED, true))
            val p = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
            p.topMargin = dp(top)
            item.layoutParams = p
            return item
           }

           private fun doBackup() {
            if (!BackupStore.hasAccess(this)) {
             BackupStore.askAccess(this)
             return
            }
            val f = BackupStore.create(this)
            if (f == null) {
             Toast.makeText(this, "ساخت پشتیبان انجام نشد", Toast.LENGTH_LONG).show()
            } else {
             AlertDialog.Builder(this)
              .setTitle("پشتیبان ساخته شد")
              .setMessage(f.name + "\n\n" + f.parentFile?.absolutePath)
              .setPositiveButton("باشه", null)
              .show()
            }
           }

           override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            window.statusBarColor = Ui.BG_TOP
            window.navigationBarColor = Ui.BG_BOTTOM
            val root = LinearLayout(this)
            root.orientation = LinearLayout.VERTICAL
            root.background = Ui.pageBg()
            root.layoutDirection = View.LAYOUT_DIRECTION_RTL

            val bar = LinearLayout(this)
            bar.orientation = LinearLayout.HORIZONTAL
