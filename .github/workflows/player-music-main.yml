            ver.setPadding(0, dp(10), 0, dp(14))
            root.addView(ver, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

            setContentView(root)
           }

           override fun finish() {
            super.finish()
            Nav.close(this)
           }
          }
