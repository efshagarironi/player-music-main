          package com.sharedl.app

          import android.app.Activity
          import android.app.Application
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.os.SystemClock
          import android.util.Base64
          import java.security.SecureRandom
          import javax.crypto.SecretKeyFactory
          import javax.crypto.spec.PBEKeySpec

          // ---------------------------------------------------------------------------
          // App lock state + saved credential (hashed with a random salt, never stored in clear)
          // ---------------------------------------------------------------------------
          object AppLock {
           @Volatile var unlocked = false
           @Volatile var showing = false
           var started = 0
           var leftAt = 0L
           const val GRACE = 3000L

           private fun sp(c: Context) = c.getSharedPreferences("lock", Context.MODE_PRIVATE)

           fun type(c: Context): String = sp(c).getString("type", "") ?: ""
           fun enabled(c: Context): Boolean = type(c).isNotEmpty()
           fun fp(c: Context): Boolean = sp(c).getBoolean("fp", false)
           fun face(c: Context): Boolean = sp(c).getBoolean("face", false)

           fun setFp(c: Context, v: Boolean) {
            sp(c).edit().putBoolean("fp", v).apply()
           }

           fun setFace(c: Context, v: Boolean) {
            sp(c).edit().putBoolean("face", v).apply()
           }

           // lock of the security page itself (asks the app pattern / PIN or fingerprint before it opens)
           fun secLock(c: Context): Boolean = sp(c).getBoolean("seclock", false) && hasSlot(c, "sec")

           // separate PIN / pattern for the security page ("sec") and for the removal protection ("uni"):
           // they work on their own, the app lock does not have to be on
           private fun sps(c: Context, slot: String) = c.getSharedPreferences("lock_" + slot, Context.MODE_PRIVATE)

           fun typeOf(c: Context, slot: String): String = sps(c, slot).getString("type", "") ?: ""
           fun hasSlot(c: Context, slot: String): Boolean = typeOf(c, slot).isNotEmpty()

           fun saveSlot(c: Context, slot: String, type: String, secret: String) {
            val salt = ByteArray(16)
            SecureRandom().nextBytes(salt)
            sps(c, slot).edit()
             .putString("type", type)
             .putString("salt", Base64.encodeToString(salt, Base64.NO_WRAP))
             .putString("hash", hash(secret, salt))
             .apply()
           }

           fun checkSlot(c: Context, slot: String, secret: String): Boolean {
            val s = sps(c, slot).getString("salt", null) ?: return false
            val h = sps(c, slot).getString("hash", null) ?: return false
            return try {
             hash(secret, Base64.decode(s, Base64.NO_WRAP)) == h
            } catch (e: Throwable) {
             false
            }
           }

           fun clearSlot(c: Context, slot: String) {
            sps(c, slot).edit().clear().apply()
           }

           fun setSecLock(c: Context, v: Boolean) {
            sp(c).edit().putBoolean("seclock", v).apply()
           }

           // lock of the private folders page (own PIN / pattern, fingerprint optional)
           fun vaultLock(c: Context): Boolean = sp(c).getBoolean("vaultlock", false) && hasSlot(c, "vault")

           fun setVaultLock(c: Context, v: Boolean) {
            sp(c).edit().putBoolean("vaultlock", v).apply()
           }

           // fingerprint as an extra way to open one of the independent locks
           fun slotFp(c: Context, slot: String): Boolean = sps(c, slot).getBoolean("fp", false)

           fun setSlotFp(c: Context, slot: String, v: Boolean) {
            sps(c, slot).edit().putBoolean("fp", v).apply()
           }

           // removal guard (accessibility service): open for a short time after the right PIN / pattern / fingerprint
           fun uninstallGuard(c: Context): Boolean = sp(c).getBoolean("uguard", false) && hasSlot(c, "ugd")

           fun setUninstallGuard(c: Context, v: Boolean) {
            sp(c).edit().putBoolean("uguard", v).apply()
           }

           // special access "usage access" (to notice which screen is in front)
           fun hasUsage(c: Context): Boolean = try {
            val ao = c.getSystemService(Context.APP_OPS_SERVICE) as android.app.AppOpsManager
            val m = if (android.os.Build.VERSION.SDK_INT >= 29) ao.unsafeCheckOpNoThrow("android:get_usage_stats", android.os.Process.myUid(), c.packageName) else ao.checkOpNoThrow("android:get_usage_stats", android.os.Process.myUid(), c.packageName)
            m == android.app.AppOpsManager.MODE_ALLOWED
           } catch (t: Throwable) {
            false
           }

           // special access "display over other apps" (to show the lock screen on top)
           fun canOverlay(c: Context): Boolean = try {
            android.provider.Settings.canDrawOverlays(c)
           } catch (t: Throwable) {
            false
           }

           fun startWatch(c: Context) {
            if (!uninstallGuard(c) || !hasUsage(c) || !canOverlay(c)) return
            try {
             val i = android.content.Intent(c, UninstallWatchService::class.java)
             if (android.os.Build.VERSION.SDK_INT >= 26) c.startForegroundService(i) else c.startService(i)
            } catch (t: Throwable) {
            }
           }

           @Volatile var guardUntil = 0L
           @Volatile var guardShowing = false
           @Volatile var guardSince = 0L

           // protection against removing the player (device administrator)
           fun noUninstall(c: Context): Boolean = sp(c).getBoolean("nouninstall", false)

           fun setNoUninstall(c: Context, v: Boolean) {
            sp(c).edit().putBoolean("nouninstall", v).apply()
           }

           private fun hash(secret: String, salt: ByteArray): String {
            val f = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA1")
            val k = f.generateSecret(PBEKeySpec(secret.toCharArray(), salt, 8000, 160))
            return Base64.encodeToString(k.encoded, Base64.NO_WRAP)
           }

           fun save(c: Context, type: String, secret: String) {
            val salt = ByteArray(16)
            SecureRandom().nextBytes(salt)
            sp(c).edit()
             .putString("type", type)
             .putString("salt", Base64.encodeToString(salt, Base64.NO_WRAP))
             .putString("hash", hash(secret, salt))
             .apply()
            unlocked = true
           }

           fun check(c: Context, secret: String): Boolean {
            val s = sp(c).getString("salt", null) ?: return false
            val h = sp(c).getString("hash", null) ?: return false
            return try {
             hash(secret, Base64.decode(s, Base64.NO_WRAP)) == h
            } catch (e: Throwable) {
             false
            }
           }

           // removes only the app lock itself; the security-page lock and the removal protection stay as they are
           fun clear(c: Context) {
            sp(c).edit().remove("type").remove("salt").remove("hash").remove("fp").remove("face").apply()
           }

           // Called whenever an activity is resumed: shows the lock screen when the app is locked.
           fun gate(a: Activity) {
            if (a is LockActivity) return
            if (!enabled(a) || unlocked || showing) return
            showing = true
            a.startActivity(Intent(a, LockActivity::class.java))
           }
          }

          // Activities of this app that run inside the Downloader's task (opened by its "send" button or player icon).
          // The Downloader broadcasts ACTION_CLOSE when it closes, and they all close with it.
          object Embed {
           const val ACTION_CLOSE = "com.sharedl.player.action.CLOSE_EMBEDDED"
           @Volatile var taskId = -1
           val acts = ArrayList<Activity>()

           fun closeAll() {
            val t = taskId
            if (t < 0) return
            taskId = -1
            for (a in ArrayList(acts)) {
             if (a.taskId == t) a.finish()
            }
           }
          }

          class App : Application() {
           override fun onCreate() {
            super.onCreate()
            val closer = object : android.content.BroadcastReceiver() {
             override fun onReceive(c: Context, i: Intent) {
              Embed.closeAll()
             }
            }
            try {
             val f = android.content.IntentFilter(Embed.ACTION_CLOSE)
             if (android.os.Build.VERSION.SDK_INT >= 33) registerReceiver(closer, f, Context.RECEIVER_EXPORTED) else registerReceiver(closer, f)
            } catch (e: Throwable) {
            }
            registerActivityLifecycleCallbacks(object : ActivityLifecycleCallbacks {
             override fun onActivityCreated(a: Activity, b: Bundle?) {
              Embed.acts.add(a)
             }

             override fun onActivityStarted(a: Activity) {
              if (AppLock.started == 0 && AppLock.leftAt > 0L &&
               SystemClock.elapsedRealtime() - AppLock.leftAt > AppLock.GRACE
              ) {
               AppLock.unlocked = false
              }
              AppLock.leftAt = 0L
              AppLock.started++
             }

             override fun onActivityResumed(a: Activity) {
              AppLock.gate(a)
             }

             override fun onActivityPaused(a: Activity) {}

             override fun onActivityStopped(a: Activity) {
              AppLock.started--
              if (AppLock.started <= 0) {
               AppLock.started = 0
               if (!a.isChangingConfigurations) AppLock.leftAt = SystemClock.elapsedRealtime()
              }
             }

             override fun onActivitySaveInstanceState(a: Activity, b: Bundle) {}

             override fun onActivityDestroyed(a: Activity) {
              Embed.acts.remove(a)
             }
            })
           }
          }
