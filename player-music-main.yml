           // ------------------------------------------------------------------ menus / dialogs
           private fun plMenu(pl: PL) {
            val names = arrayOf("تغییر نام", "افزودن ویدئو", "حذف فهرست")
            AlertDialog.Builder(this)
             .setItems(names) { _, w ->
              if (w == 0) {
               askName(pl)
              } else if (w == 1) {
               showPicker(pl)
              } else {
               AlertDialog.Builder(this)
                .setMessage("فهرست «" + pl.name + "» حذف شود؟ (خود ویدئوها پاک نمی‌شوند)")
                .setPositiveButton("حذف") { _, _ ->
                 lists.remove(pl)
                 save()
                 showList()
                }
                .setNegativeButton("لغو", null)
                .show()
              }
             }
             .show()
           }

           private fun itemMenu(pl: PL, i: Int) {
            val names = arrayOf("انتقال به بالا", "انتقال به پایین", "حذف از فهرست")
            AlertDialog.Builder(this)
             .setItems(names) { _, w ->
              if (w == 0) {
               if (i > 0) java.util.Collections.swap(pl.items, i, i - 1)
              } else if (w == 1) {
               if (i < pl.items.size - 1) java.util.Collections.swap(pl.items, i, i + 1)
              } else {
               pl.items.removeAt(i)
              }
              save()
              refresh()
             }
             .show()
           }

           private fun askName(pl: PL?) {
            val et = EditText(this)
            et.setSingleLine(true)
            et.hint = "نام فهرست"
            et.setText(if (pl == null) "" else pl.name)
            et.setSelection(et.text.length)
            val box = FrameLayout(this)
            box.setPadding(dp(20), dp(8), dp(20), 0)
            box.addView(et, FrameLayout.LayoutParams(MP, WC))
            AlertDialog.Builder(this)
             .setTitle(if (pl == null) "فهرست‌پخش جدید" else "تغییر نام")
             .setView(box)
             .setPositiveButton("تأیید") { _, _ ->
              val n = et.text.toString().trim()
              if (n.isNotEmpty()) {
               if (pl == null) {
                val np = PL(System.currentTimeMillis(), n, ArrayList())
                lists.add(0, np)
                save()
                showDetail(np)
               } else {
                pl.name = n
                save()
                refresh()
               }
              }
             }
             .setNegativeButton("لغو", null)
             .show()
           }

           // ------------------------------------------------------------------ playing
           private fun play(pl: PL, start: Int, shuffle: Boolean) {
            if (pl.items.isEmpty()) {
             Toast.makeText(this, "فهرست خالی است", Toast.LENGTH_SHORT).show()
             return
            }
            val order = ArrayList<Item>(pl.items)
            var idx = start
            if (shuffle) {
             order.shuffle()
             idx = 0
            }
            val u = order.map { it.uri }.toTypedArray()
            val t = order.map { it.title }.toTypedArray()
            if (standalone) {
             val i = Intent(this, PlayerActivity::class.java)
             i.putExtra("uris", u)
             i.putExtra("titles", t)
             i.putExtra("index", idx.coerceIn(0, u.size - 1))
             i.putExtra("startPos", 0)
             i.putExtra("autoNext", true)
             startActivity(i)
            } else {
             val d = Intent()
             d.putExtra("uris", u)
             d.putExtra("titles", t)
             d.putExtra("index", idx.coerceIn(0, u.size - 1))
             d.putExtra("startPos", 0)
             d.putExtra("autoNext", true)
             setResult(RESULT_OK, d)
             finish()
            }
           }

           // ------------------------------------------------------------------ picker: add videos to a playlist
           private fun queryVideos(): ArrayList<Vid> {
            val out = ArrayList<Vid>()
            try {
             val q = contentResolver.query(
              MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
              arrayOf(
               MediaStore.Video.Media._ID,
               MediaStore.Video.Media.DISPLAY_NAME,
               MediaStore.Video.Media.DURATION,
               MediaStore.Video.Media.DATA
              ),
              null, null, null
             )
             if (q != null) {
              q.use { c ->
               while (c.moveToNext()) {
                val name = c.getString(1)
                if (name != null) {
                 val id = c.getLong(0)
                 val uri = android.content.ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)
                 val data = c.getString(3) ?: ""
                 val parent = if (data.contains('/')) data.substringBeforeLast('/') else ""
                 val dn = if (parent.isEmpty()) "حافظه" else parent.substringAfterLast('/')
                 out.add(Vid(uri, name.substringBeforeLast('.'), c.getLong(2), parent, dn))
                }
               }
              }
             }
            } catch (e: Throwable) {
            }
            return out
           }

           private fun showPicker(pl: PL) {
            val vids = queryVideos()
            if (vids.isEmpty()) {
             Toast.makeText(this, "ویدئویی روی گوشی پیدا نشد", Toast.LENGTH_SHORT).show()
             return
            }
            val have = HashSet<String>()
            for (x in pl.items) have.add(x.uri)
            val groups = LinkedHashMap<String, ArrayList<Vid>>()
            for (v in vids) groups.getOrPut(v.dirKey) { ArrayList() }.add(v)
            val keys = ArrayList(groups.keys)
            keys.sortWith(Comparator<String> { a, b -> groups[a]!![0].dirName.lowercase().compareTo(groups[b]!![0].dirName.lowercase()) })
            val entries = ArrayList<Entry>()
            val byUri = HashMap<String, Vid>()
            for (k in keys) {
             val g = groups[k]!!
             g.sortWith(Comparator<Vid> { a, b -> a.title.lowercase().compareTo(b.title.lowercase()) })
             entries.add(Entry(g[0].dirName, g, null))
             for (v in g) {
              entries.add(Entry(null, null, v))
              byUri[v.uri.toString()] = v
             }
            }
            val sel = LinkedHashSet<String>()

            val dlg = Dialog(this, android.R.style.Theme_Material_NoActionBar)
