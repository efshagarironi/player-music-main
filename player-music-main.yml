          // ---------------------------------------------------------------------------
          // 3x3 pattern pad
          // ---------------------------------------------------------------------------
          class PatternView(ctx: Context) : View(ctx) {
           var onDone: ((List<Int>) -> Unit)? = null
           var inputEnabled = true
           var error = false
            set(v) {
             field = v
             invalidate()
            }
           private val sel = ArrayList<Int>()
           private var fx = 0f
           private var fy = 0f
           private var drawing = false

           private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
            style = Paint.Style.STROKE
            strokeWidth = Ui.dp(ctx, 4).toFloat()
            strokeCap = Paint.Cap.ROUND
           }
           private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
           private val dot = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }

           private fun cx(i: Int) = width / 6f + (i % 3) * width / 3f
           private fun cy(i: Int) = height / 6f + (i / 3) * height / 3f

           override fun onDraw(c: Canvas) {
            val col = if (error) Ui.DANGER else Ui.GREEN
            line.color = col
            for (k in 1 until sel.size) c.drawLine(cx(sel[k - 1]), cy(sel[k - 1]), cx(sel[k]), cy(sel[k]), line)
            if (drawing && sel.isNotEmpty()) c.drawLine(cx(sel.last()), cy(sel.last()), fx, fy, line)
            for (i in 0..8) {
             if (i in sel) {
              ring.color = Color.argb(60, Color.red(col), Color.green(col), Color.blue(col))
              c.drawCircle(cx(i), cy(i), width / 11f, ring)
              dot.color = col
              c.drawCircle(cx(i), cy(i), width / 26f, dot)
             } else {
              dot.color = Ui.MUTED
              c.drawCircle(cx(i), cy(i), width / 30f, dot)
             }
            }
           }

           private fun hit(x: Float, y: Float) {
            val r = width / 8f
            for (i in 0..8) {
             if (i in sel) continue
             val dx = x - cx(i)
             val dy = y - cy(i)
             if (dx * dx + dy * dy < r * r) {
              sel.add(i)
              performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
              break
             }
            }
           }

           fun reset() {
            sel.clear()
            error = false
            invalidate()
           }

           override fun onTouchEvent(e: MotionEvent): Boolean {
            if (!inputEnabled) return true
            when (e.action) {
             MotionEvent.ACTION_DOWN -> {
              parent?.requestDisallowInterceptTouchEvent(true)
              reset()
              drawing = true
              fx = e.x
              fy = e.y
              hit(e.x, e.y)
              invalidate()
             }
             MotionEvent.ACTION_MOVE -> {
              fx = e.x
              fy = e.y
              hit(e.x, e.y)
              invalidate()
             }
             MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
              drawing = false
              invalidate()
              if (sel.isNotEmpty()) onDone?.invoke(ArrayList(sel))
             }
            }
            return true
           }
          }

