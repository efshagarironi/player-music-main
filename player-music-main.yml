          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          // Backup of all app settings as one .json file in "ShareDL Backup" (created the first time a backup is made)
          object BackupStore {
           // settings files that are saved (lock / login sessions / watch history are not part of a backup)
           private val NAMES = arrayOf("browser", "prefs")
           private val SKIP = setOf("igCookie", "igLogin", "ytLogin")

           fun hasAccess(ctx: Context): Boolean {
            if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager()
            if (Build.VERSION.SDK_INT >= 23 && Build.VERSION.SDK_INT <= 28) {
             return ctx.checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
            }
            return true
           }

           fun askAccess(a: Activity) {
            if (Build.VERSION.SDK_INT >= 30) {
             AlertDialog.Builder(a)
              .setMessage("برای ساختن و خواندن نسخه پشتیبان در حافظه گوشی، اجازهٔ «دسترسی به همهٔ فایل‌ها» لازم است.")
              .setPositiveButton("تنظیمات") { _, _ ->
               try {
                a.startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + a.packageName)))
               } catch (e: Throwable) {
                try {
                 a.startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                } catch (e2: Throwable) {
                }
               }
              }
              .setNegativeButton("لغو", null)
              .show()
            } else if (Build.VERSION.SDK_INT >= 23) {
             a.requestPermissions(arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE), 71)
            }
           }

           private fun mainDir(): File = File(Environment.getExternalStorageDirectory(), "ShareDL Backup")

           private fun fallbackDir(ctx: Context): File = File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "ShareDL Backup")

           private fun targetDir(ctx: Context): File {
            val d = mainDir()
            if (hasAccess(ctx) && (d.isDirectory || d.mkdirs()) && d.canWrite()) return d
            val f = fallbackDir(ctx)
            f.mkdirs()
            return f
           }

           private fun entry(v: Any?): JSONObject? {
            val e = JSONObject()
            if (v is Boolean) {
             e.put("t", "b")
             e.put("v", v)
            } else if (v is Int) {
             e.put("t", "i")
             e.put("v", v.toLong())
            } else if (v is Long) {
             e.put("t", "l")
             e.put("v", v)
            } else if (v is Float) {
             e.put("t", "f")
             e.put("v", v.toDouble())
            } else if (v is String) {
             e.put("t", "s")
             e.put("v", v)
            } else if (v is Set<*>) {
             val a = JSONArray()
             for (x in v) a.put(x.toString())
             e.put("t", "set")
             e.put("v", a)
            } else {
             return null
            }
            return e
           }

           fun create(ctx: Context): File? {
            return try {
             val root = JSONObject()
             root.put("app", "ShareDL")
             root.put("v", 1)
             root.put("time", System.currentTimeMillis())
             val ps = JSONObject()
             for (n in NAMES) {
              val sp = ctx.getSharedPreferences(n, Context.MODE_PRIVATE)
              val o = JSONObject()
              for ((k, v) in sp.all) {
               if (n == "prefs" && SKIP.contains(k)) continue
               val e = entry(v) ?: continue
               o.put(k, e)
              }
              ps.put(n, o)
             }
             root.put("prefs", ps)
             val d = targetDir(ctx)
             val f = File(d, "backup_" + SimpleDateFormat("yyyy-MM-dd_HH-mm-ss", Locale.US).format(Date()) + ".json")
             f.writeText(root.toString(), Charsets.UTF_8)
             f
            } catch (e: Throwable) {
             null
            }
           }

           fun list(ctx: Context): ArrayList<File> {
            val out = ArrayList<File>()
            val dirs = arrayOf(mainDir(), fallbackDir(ctx))
            for (d in dirs) {
             val fs: Array<File>? = try {
              d.listFiles()
             } catch (e: Throwable) {
              null
             }
             if (fs == null) continue
             for (f in fs) if (f.isFile && f.name.startsWith("backup_") && f.name.endsWith(".json")) out.add(f)
            }
            out.sortByDescending { it.name }
            return out
           }

           fun restore(ctx: Context, f: File): Boolean {
            return try {
             val root = JSONObject(f.readText(Charsets.UTF_8))
             if (root.optString("app") != "ShareDL") return false
             val ps = root.getJSONObject("prefs")
             for (n in NAMES) {
              val o = ps.optJSONObject(n) ?: continue
              val sp = ctx.getSharedPreferences(n, Context.MODE_PRIVATE)
              val ed = sp.edit()
              for (k in sp.all.keys) {
               if (!(n == "prefs" && SKIP.contains(k))) ed.remove(k)
              }
              val ks = o.keys()
              while (ks.hasNext()) {
               val k = ks.next()
               val e = o.getJSONObject(k)
               when (e.getString("t")) {
                "b" -> ed.putBoolean(k, e.getBoolean("v"))
                "i" -> ed.putInt(k, e.getInt("v"))
                "l" -> ed.putLong(k, e.getLong("v"))
                "f" -> ed.putFloat(k, e.getDouble("v").toFloat())
                "s" -> ed.putString(k, e.getString("v"))
                "set" -> {
                 val a = e.getJSONArray("v")
                 val s = HashSet<String>()
                 for (i in 0 until a.length()) s.add(a.getString(i))
                 ed.putStringSet(k, s)
                }
               }
              }
              ed.commit()
             }
             true
            } catch (e: Throwable) {
             false
            }
           }
          }

