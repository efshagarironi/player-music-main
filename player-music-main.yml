           private fun submit(secret: String) {
            if (mode == "unlock") {
             val now = SystemClock.elapsedRealtime()
             if (now < blockedUntil) {
              warn("چند بار اشتباه وارد شد؛ " + ((blockedUntil - now) / 1000 + 1) + " ثانیه دیگر صبر کن")
              resetInput(true)
              return
             }
             if (checkSecret(secret)) {
              unlockOk()
             } else {
              fails++
              if (fails >= 5) {
               fails = 0
               blockedUntil = now + 30000L
               warn("۵ بار اشتباه وارد شد؛ ۳۰ ثانیه صبر کن")
              } else {
