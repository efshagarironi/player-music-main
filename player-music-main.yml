           private fun showNow(on: Boolean) {
            nowPanel.visibility = if (on && MusicService.current() != null) View.VISIBLE else View.GONE
            if (nowPanel.visibility == View.VISIBLE) {
             val m = (getSystemService(INPUT_METHOD_SERVICE) as android.view.inputmethod.InputMethodManager)
             m.hideSoftInputFromWindow(nowPanel.windowToken, 0)
            }
            refresh()
           }

           // ------------------------------------------------------------------ live state
           private fun refresh() {
            val t = MusicService.current()
            val s = MusicService.inst
            val playing = s != null && (s.isPlaying() || s.loading())
            miniBar.visibility = if (t != null) View.VISIBLE else View.GONE
            if (t == null) {
             if (nowPanel.visibility == View.VISIBLE) nowPanel.visibility = View.GONE
             shownArtKey = ""
             adapter.notifyDataSetChanged()
             return
            }
            miniTitle.text = if (t.artist.isEmpty()) t.title else t.title + "\n" + t.artist
            miniPlay.text = if (playing) "⏸" else "▶"
            nPlay.text = if (playing) "⏸" else "▶"
            nTitle.text = t.title
            nArtist.text = t.artist
            if (shownArtKey != t.key) {
             shownArtKey = t.key
             nArt.scaleType = ImageView.ScaleType.FIT_CENTER
             nArt.setPadding(dp(14), dp(14), dp(14), dp(14))
             nArt.setImageResource(R.drawable.ic_music_fab)
             val key = t.key
             MusicArt.load(this, t) { b ->
              if (b != null && shownArtKey == key) {
               nArt.setPadding(0, 0, 0, 0)
               nArt.scaleType = ImageView.ScaleType.CENTER_CROP
               nArt.setImageBitmap(b)
              }
             }
            }
            nShuffle.setTextColor(if (MusicService.shuffle) Ui.GREEN else Ui.MUTED)
            nShuffle.alpha = if (MusicService.shuffle) 1f else 0.7f
            nRepeat.text = if (MusicService.repeat == 2) "🔂" else "🔁"
            nRepeat.alpha = if (MusicService.repeat == 0) 0.45f else 1f
            val sp = MusicService.speed
            nSpeed.text = (if (sp == sp.toInt().toFloat()) sp.toInt().toString() else sp.toString()) + "×"
            val left = MusicService.sleepAt - System.currentTimeMillis()
            nSleep.text = if (MusicService.sleepAt > 0L && left > 0L) "😴  " + fa(((left + 59999L) / 60000L).toString()) + " دقیقه" else "😴  زمان‌سنج"
            adapter.notifyDataSetChanged()
            updateProgress()
           }

           private fun updateProgress() {
            if (nowPanel.visibility != View.VISIBLE || dragging) return
            val s = MusicService.inst ?: return
            val d = s.duration()
            if (d > 0) {
             nSeek.max = d
             nSeek.progress = s.position()
             nTot.text = Ui.dur(d.toLong())
             nCur.text = Ui.dur(s.position().toLong())
            }
           }

           private fun cycleSpeed() {
            var k = speeds.indexOfFirst { it == MusicService.speed }
            k = (k + 1) % speeds.size
            val s = MusicService.inst
            if (s != null) s.setSpeed(speeds[k]) else MusicService.speed = speeds[k]
            refresh()
           }

           private fun showSleep() {
            val mins = intArrayOf(15, 30, 45, 60, 90, 0)
            val names = arrayOf("۱۵ دقیقه", "۳۰ دقیقه", "۴۵ دقیقه", "۶۰ دقیقه", "۹۰ دقیقه", "لغو زمان‌سنج")
            AlertDialog.Builder(this)
             .setTitle("خاموش شدن خودکار")
             .setItems(names) { _, w ->
              val s = MusicService.inst
              if (s != null) s.setSleep(mins[w])
              refresh()
             }
             .setNegativeButton("بستن", null)
             .show()
           }

           private fun showQueue() {
            val q = MusicService.queue
            val o = MusicService.order
            if (o.isEmpty() || o.size != q.size) return
            val names = Array(o.size) { k -> (if (k == MusicService.pos) "▶  " else "      ") + q[o[k]].title }
            AlertDialog.Builder(this)
             .setTitle("صف پخش")
             .setItems(names) { _, w -> MusicService.inst?.jumpTo(w) }
             .setNegativeButton("بستن", null)
             .show()
           }

           private fun openEq() {
            val i = Intent(AudioEffect.ACTION_DISPLAY_AUDIO_EFFECT_CONTROL_PANEL)
            i.putExtra(AudioEffect.EXTRA_AUDIO_SESSION, MusicService.inst?.sessionId() ?: 0)
            i.putExtra(AudioEffect.EXTRA_CONTENT_TYPE, AudioEffect.CONTENT_TYPE_MUSIC)
            i.putExtra(AudioEffect.EXTRA_PACKAGE_NAME, packageName)
            try {
             startActivity(i)
            } catch (e: Throwable) {
             toast("اکولایزر در این گوشی پیدا نشد")
            }
           }
          }

