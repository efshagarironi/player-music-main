               val iB = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
               val iD = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
               val iP = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DATA)
               val iN = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DISPLAY_NAME)
               while (c.moveToNext()) {
                val id = c.getLong(iId)
                val dn = c.getString(iN) ?: ""
                var title = c.getString(iT) ?: ""
                if (title.isBlank()) title = dn.substringBeforeLast('.')
                var artist = c.getString(iA) ?: ""
                if (artist == "<unknown>") artist = ""
                var album = c.getString(iB) ?: ""
                if (album == "<unknown>") album = ""
                val path = c.getString(iP) ?: ""
                out.add(Track(id, android.content.ContentUris.withAppendedId(a, id), title, artist, album, c.getLong(iD), path))
               }
              }
             } catch (e: Throwable) {
             }
             val map = LinkedHashMap<String, ArrayList<Track>>()
             for (t in out) map.getOrPut(t.dir) { ArrayList() }.add(t)
             val coll = java.text.Collator.getInstance(java.util.Locale("fa"))
             val fl = ArrayList<Pair<String, List<Track>>>()
             for ((d, l) in map) fl.add(Pair(d, l))
             fl.sortWith(Comparator { x, y -> coll.compare(lastSeg(x.first), lastSeg(y.first)) })
             ui.post {
              all = out
              folders = fl
              scanned = true
              render()
             }
            }
           }

           // ------------------------------------------------------------------ list page
           private fun match(t: Track, q: String): Boolean =
            t.title.lowercase().contains(q) || t.artist.lowercase().contains(q) || t.album.lowercase().contains(q)

           private fun render() {
            val q = query.trim().lowercase()
            val out = ArrayList<Any>()
            val tl = ArrayList<Track>()
            if (mode == 1) {
             val l = folders.firstOrNull { it.first == curDir }?.second ?: emptyList()
             for (t in l) if (q.isEmpty() || match(t, q)) {
              out.add(t)
              tl.add(t)
             }
             titleTv.text = lastSeg(curDir)
            } else if (q.isNotEmpty()) {
             for (t in all) if (match(t, q)) {
              out.add(t)
              tl.add(t)
             }
             titleTv.text = "نتایج جستجو"
            } else {
             for ((d, l) in folders) out.add(FRow(d, lastSeg(d), l.size))
             titleTv.text = "موزیک پلیر"
            }
            rows = out
            shown = tl
            actionRow.visibility = if (tl.isNotEmpty()) View.VISIBLE else View.GONE
            emptyTv.visibility = if (out.isEmpty() && scanned) View.VISIBLE else View.GONE
            adapter.notifyDataSetChanged()
           }

           private fun onRow(p: Int) {
            val it = rows.getOrNull(p) ?: return
            if (it is FRow) {
             mode = 1
             curDir = it.dir
             searchBox.setText("")
             render()
             list.setSelection(0)
            } else if (it is Track) {
             val idx = shown.indexOfFirst { x -> x.key == it.key }
             MusicService.playQueue(this, ArrayList(shown), if (idx < 0) 0 else idx, false)
            }
           }

           private fun toggleSearch() {
            if (searchBox.visibility == View.VISIBLE) {
             searchBox.setText("")
             searchBox.visibility = View.GONE
             (getSystemService(INPUT_METHOD_SERVICE) as android.view.inputmethod.InputMethodManager).hideSoftInputFromWindow(searchBox.windowToken, 0)
            } else {
             searchBox.visibility = View.VISIBLE
             searchBox.requestFocus()
             (getSystemService(INPUT_METHOD_SERVICE) as android.view.inputmethod.InputMethodManager).showSoftInput(searchBox, 0)
            }
           }

           inner class Adapter : BaseAdapter() {
            override fun getCount(): Int = rows.size
            override fun getItem(position: Int): Any = rows[position]
            override fun getItemId(position: Int): Long = position.toLong()

            override fun getView(p: Int, cv: View?, parent: ViewGroup?): View {
             val h = (cv?.tag as? TH) ?: makeRow()
             val item = rows[p]
             if (item is FRow) {
              h.icon.text = "📁"
              h.icon.setTextColor(Ui.TEXT)
              h.title.text = item.name
              h.title.setTextColor(Ui.TEXT)
              h.sub.text = fa(item.count.toString()) + " آهنگ"
             } else if (item is Track) {
              val cur = MusicService.current()
              val playing = cur != null && cur.key == item.key
              h.icon.text = if (playing) "▶" else "♪"
              h.icon.setTextColor(if (playing) Ui.GREEN else Ui.MUTED)
              h.title.text = item.title
              h.title.setTextColor(if (playing) Ui.GREEN else Ui.TEXT)
              val a = if (item.artist.isEmpty()) "" else item.artist + "  ·  "
              h.sub.text = a + fa(Ui.dur(item.duration))
             }
             return h.root
            }
           }

           private fun makeRow(): TH {
            val r = LinearLayout(this)
            r.orientation = LinearLayout.HORIZONTAL
            r.gravity = Gravity.CENTER_VERTICAL
            r.setPadding(dp(14), dp(10), dp(14), dp(10))
            val ic = label("♪", 20f, Ui.MUTED)
            ic.gravity = Gravity.CENTER
            r.addView(ic, LinearLayout.LayoutParams(dp(40), ViewGroup.LayoutParams.WRAP_CONTENT))
            val col = LinearLayout(this)
            col.orientation = LinearLayout.VERTICAL
            val t = label("", 15f, Ui.TEXT, true)
            t.maxLines = 1
            t.ellipsize = TextUtils.TruncateAt.END
            val s = label("", 12f, Ui.MUTED)
            s.maxLines = 1
            s.ellipsize = TextUtils.TruncateAt.END
            col.addView(t)
            col.addView(s)
            r.addView(col, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
            val h = TH(r, ic, t, s)
            r.tag = h
            return h
           }

