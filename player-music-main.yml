             }
             line.style = Paint.Style.STROKE
             line.strokeWidth = 1.9f
            } else if (kind == 6) {
             // resume position: solid floppy disk; with a clock on the label when ON, blank label when OFF
             val fp = Path()
             fp.fillType = Path.FillType.EVEN_ODD
             fp.moveTo(6f, 2.5f)
             fp.lineTo(17f, 2.5f)
             fp.lineTo(21f, 6.5f)
             fp.lineTo(21f, 19f)
             fp.quadTo(21f, 21.5f, 18.5f, 21.5f)
             fp.lineTo(5.5f, 21.5f)
             fp.quadTo(3f, 21.5f, 3f, 19f)
             fp.lineTo(3f, 5.5f)
             fp.quadTo(3f, 2.5f, 6f, 2.5f)
             fp.close()
             fp.addRoundRect(8f, 3.7f, 16f, 9.2f, 0.9f, 0.9f, Path.Direction.CW)
             fp.addRoundRect(13.2f, 4.4f, 15.2f, 8.4f, 0.5f, 0.5f, Path.Direction.CW)
             fp.addRoundRect(5.2f, 11.8f, 18.8f, 19.8f, 1.2f, 1.2f, Path.Direction.CW)
             line.style = Paint.Style.FILL
             c.drawPath(fp, line)
             line.style = Paint.Style.STROKE
             if (resumeOn) {
              line.strokeWidth = 1.2f
              c.drawCircle(12f, 15.8f, 3.1f, line)
              line.strokeWidth = 1.1f
              c.drawLine(12f, 14.2f, 12f, 15.9f, line)
              c.drawLine(12f, 15.9f, 13.4f, 16.9f, line)
             }
             line.strokeWidth = 1.9f
            } else if (kind == 1) {
             // portrait phone (front) + landscape phone (back); the one matching the current orientation is solid & bright,
             // the other one is hollow & dim. Both arrows have clear solid heads.
             val dimA = 110
             val backOn = landscape
             val frontOn = !landscape
             val bl = Path()
             bl.addRoundRect(3f, 8f, 21f, 16f, 2f, 2f, Path.Direction.CW)
             val ph = Path()
             ph.addRoundRect(7.5f, 5.2f, 16f, 19.2f, 1.8f, 1.8f, Path.Direction.CW)
             // landscape phone
             fun drawLandPhone() {
              if (backOn) {
               line.style = Paint.Style.FILL_AND_STROKE
               line.strokeWidth = 1f
               line.alpha = 255
              } else {
               line.style = Paint.Style.STROKE
               line.strokeWidth = 1.4f
               line.alpha = dimA
              }
              c.drawPath(bl, line)
              line.style = Paint.Style.STROKE
              line.strokeWidth = 1.3f
              if (backOn) line.color = Color.BLACK
              c.drawLine(19.2f, 10.8f, 19.2f, 13.2f, line)
              line.color = Color.WHITE
             }
             // portrait phone
             fun drawPortPhone() {
              if (frontOn) {
               line.style = Paint.Style.FILL_AND_STROKE
               line.strokeWidth = 1f
               line.alpha = 255
              } else {
               line.style = Paint.Style.STROKE
               line.strokeWidth = 1.4f
               line.alpha = dimA
              }
              c.drawPath(ph, line)
              line.style = Paint.Style.STROKE
              line.strokeWidth = 1.3f
              if (frontOn) line.color = Color.BLACK
              c.drawLine(10.7f, 17.3f, 12.8f, 17.3f, line)
              line.color = Color.WHITE
             }
             // the active phone is always drawn on top (swaps places with the other one)
             if (landscape) {
              drawPortPhone()
              drawLandPhone()
             } else {
              drawLandPhone()
              drawPortPhone()
             }
             // arrows
             line.alpha = 255
             line.strokeWidth = 1.7f
             val ar = Path()
             ar.moveTo(13f, 2.3f)
             ar.quadTo(20.5f, 1.9f, 21f, 5f)
             c.drawPath(ar, line)
             val ar2 = Path()
             ar2.moveTo(11f, 21.8f)
             ar2.quadTo(3.5f, 22.1f, 3f, 19f)
             c.drawPath(ar2, line)
             line.style = Paint.Style.FILL_AND_STROKE
             line.strokeWidth = 0.8f
             line.strokeJoin = Paint.Join.ROUND
             val h1 = Path()
             h1.moveTo(18.5f, 4.6f); h1.lineTo(23.5f, 4.6f); h1.lineTo(21f, 7.6f); h1.close()
             c.drawPath(h1, line)
             val h2 = Path()
             h2.moveTo(0.5f, 19.4f); h2.lineTo(5.5f, 19.4f); h2.lineTo(3f, 16.4f); h2.close()
             c.drawPath(h2, line)
             line.style = Paint.Style.STROKE
             line.strokeWidth = 1.9f
            } else if (kind == 2) {
             c.drawLine(4f, 6.5f, 20f, 6.5f, line)
             val h = Path()
             h.moveTo(9f, 6.5f); h.lineTo(9f, 3.8f); h.lineTo(15f, 3.8f); h.lineTo(15f, 6.5f)
             c.drawPath(h, line)
             val body = Path()
             body.moveTo(6f, 6.5f); body.lineTo(7f, 20.5f); body.lineTo(17f, 20.5f); body.lineTo(18f, 6.5f)
             c.drawPath(body, line)
             c.drawLine(10f, 10f, 10f, 16.5f, line)
             c.drawLine(14f, 10f, 14f, 16.5f, line)
            } else if (mode == 2) {
             glyph(c, "A", 12f, 8.5f, 12f)
             c.drawLine(3f, 17.5f, 20.5f, 17.5f, line)
             arrowRight(c, 20.5f, 17.5f)
            } else {
             // vertical repeat loop: up arrow on the left, down arrow on the right
             val l = 5.5f
             val r = 18.5f
             val t = 4.5f
             val b = 19.5f
             val rad = 3.5f
             val lp = Path()
             lp.moveTo(r - 4f, b)
             lp.lineTo(l + rad, b)
             lp.quadTo(l, b, l, b - rad)
             lp.lineTo(l, t - 1.5f)
             c.drawPath(lp, line)
             val ua = Path()
             ua.moveTo(l - 3.2f, t + 1.7f); ua.lineTo(l, t - 1.5f); ua.lineTo(l + 3.2f, t + 1.7f)
             c.drawPath(ua, line)
             val rp = Path()
             rp.moveTo(l + 5f, t)
             rp.lineTo(r - rad, t)
             rp.quadTo(r, t, r, t + rad)
             rp.lineTo(r, b + 1.5f)
             c.drawPath(rp, line)
             val da = Path()
             da.moveTo(r - 3.2f, b - 1.7f); da.lineTo(r, b + 1.5f); da.lineTo(r + 3.2f, b - 1.7f)
             c.drawPath(da, line)
             if (mode == 0) glyph(c, "A", 12f, 12f, 9.5f)
             if (mode == 1) glyph(c, "1", 12f, 12f, 9.5f)
            }
            c.restore()
           }
          }

          class ZoomVideoView(ctx: Context) : VideoView(ctx) {
           var vidW = 0
           var vidH = 0
           // 0 = fit, 1 = stretch, 2 = crop (fill), 3 = original size
           var fitMode = 0
            set(v) {
             field = v
             requestLayout()
            }

           fun setVideoSize(w: Int, h: Int) {
            vidW = w
            vidH = h
            requestLayout()
           }

           override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
            val pw = getDefaultSize(0, widthMeasureSpec)
            val ph = getDefaultSize(0, heightMeasureSpec)
            if (vidW <= 0 || vidH <= 0) {
             setMeasuredDimension(pw, ph)
             return
            }
            var w = pw
            var h = ph
            when (fitMode) {
             0 -> {
              if (vidW.toLong() * ph > pw.toLong() * vidH) h = (pw.toLong() * vidH / vidW).toInt()
              else w = (ph.toLong() * vidW / vidH).toInt()
             }
             1 -> {
             }
             2 -> {
              if (vidW.toLong() * ph > pw.toLong() * vidH) w = (ph.toLong() * vidW / vidH).toInt()
              else h = (pw.toLong() * vidH / vidW).toInt()
             }
             else -> {
              w = vidW
              h = vidH
             }
            }
            setMeasuredDimension(w, h)
           }
          }

