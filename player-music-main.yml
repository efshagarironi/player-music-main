           private fun buildNow() {
            nowPanel = LinearLayout(this)
            nowPanel.orientation = LinearLayout.VERTICAL
            nowPanel.background = Ui.pageBg()
            nowPanel.layoutDirection = View.LAYOUT_DIRECTION_LTR
            nowPanel.setPadding(dp(22), dp(10), dp(22), dp(16))
            nowPanel.visibility = View.GONE
            nowPanel.isClickable = true

            // top row: close / title / queue
            val top = LinearLayout(this)
            top.orientation = LinearLayout.HORIZONTAL
            top.gravity = Gravity.CENTER_VERTICAL
            top.addView(ctl("⌄", 28f) { showNow(false) }, LinearLayout.LayoutParams(dp(48), dp(44)))
            val hd = label("در حال پخش", 15f, Ui.MUTED)
            hd.gravity = Gravity.CENTER
            top.addView(hd, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
            top.addView(ctl("☰", 22f) { showQueue() }, LinearLayout.LayoutParams(dp(48), dp(44)))
            nowPanel.addView(top)

            // cover
