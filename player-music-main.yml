            for (f in files) total += f.length()

            val bar = LinearLayout(this)
            bar.orientation = LinearLayout.HORIZONTAL
            bar.gravity = Gravity.CENTER_VERTICAL
            val addB = VaultAddIconView(this)
            addB.setPadding(dp(8), dp(8), dp(8), dp(8))
            addB.setOnClickListener { addVideos(name) }
            bar.addView(addB, LinearLayout.LayoutParams(dp(40), dp(40)))
            val title = label((if (VaultStore.noLock(this, name)) "📂  " else "🔒  ") + name, 18f, Ui.TEXT, true)
            title.maxLines = 1
            title.ellipsize = TextUtils.TruncateAt.END
            title.setPaddingRelative(dp(8), 0, dp(8), 0)
            bar.addView(title, LinearLayout.LayoutParams(0, WC, 1f))
            bar.addView(layoutButton(), LinearLayout.LayoutParams(dp(40), dp(40)))
            content.addView(bar)
            curBar = bar
            addSelBar()
            applyTopBar()

            val col = LinearLayout(this)
            col.orientation = LinearLayout.VERTICAL
            val sum = label(fa(files.size.toString()) + " فیلم · " + fa(Ui.size(total)), 12f, Ui.MUTED)
            sum.setPadding(dp(20), dp(10), dp(20), dp(8))
            if (!hideDetail) col.addView(sum)

            if (files.isEmpty()) {
             val e = label("پوشه خالی است؛ با دکمهٔ ＋ ویدئو اضافه کنید", 14f, Ui.MUTED)
             e.gravity = Gravity.CENTER
             col.addView(e, LinearLayout.LayoutParams(MP, dp(140)))
             content.addView(withShade(col), LinearLayout.LayoutParams(MP, 0, 1f))
             return
            }

            val lv = makeList(4, files.size) { p -> if (vView == 1) videoRow(name, files, p) else videoTile(files, p) }
