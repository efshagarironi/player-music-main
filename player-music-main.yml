           // ---- properties dialog (same look as the folders page): one video, one folder or several items
           private fun infoBytes(b: Long): String {
            val a = if (b >= 1000000000L) String.format(java.util.Locale.US, "%.2f GB", b / 1e9) else if (b >= 1000000L) String.format(java.util.Locale.US, "%d MB", Math.round(b / 1e6)) else String.format(java.util.Locale.US, "%d KB", Math.round(b / 1e3))
            return fa(a) + " (" + fa(String.format(java.util.Locale.US, "%,d", b).replace(',', '\u2019')) + " بایت)"
           }

           private fun infoDate(ms: Long): String {
            val c = java.util.Calendar.getInstance()
            c.timeInMillis = ms
            val months = arrayOf("ژانویه", "فوریه", "مارس", "آوریل", "مه", "ژوئن", "ژوئیه", "اوت", "سپتامبر", "اکتبر", "نوامبر", "دسامبر")
            val h24 = c.get(java.util.Calendar.HOUR_OF_DAY)
            val h12 = if (h24 % 12 == 0) 12 else h24 % 12
            val mn = c.get(java.util.Calendar.MINUTE)
            val ap = if (h24 >= 12) "ب.ظ." else "ق.ظ."
            return fa(c.get(java.util.Calendar.DAY_OF_MONTH).toString()) + " " + months[c.get(java.util.Calendar.MONTH)] + " " +
             fa(c.get(java.util.Calendar.YEAR).toString()) + " ساعت " +
             fa(h12.toString() + ":" + String.format(java.util.Locale.US, "%02d", mn)) + " " + ap
           }

           private fun infoFormat(name: String): String {
            val e = name.substringAfterLast('.', "").lowercase()
            return when (e) {
             "mp4", "m4v" -> "MPEG-4"
             "mkv" -> "Matroska"
             "webm" -> "WebM"
             "3gp" -> "3GPP"
             "avi" -> "AVI"
             "mov" -> "QuickTime"
             "ts" -> "MPEG-TS"
             "flv" -> "Flash Video"
             else -> e.uppercase()
            }
           }

           private fun showInfo() {
            if (sel.isEmpty()) return
            val c = cur
            var title = ""
            var single = false
            var hasSec = false
            val items = ArrayList<Array<String>>()
            fun sec(t: String) {
             hasSec = true
             items.add(arrayOf("s", t))
            }
            fun row(k: String, v: String) {
             items.add(arrayOf("r", k, v))
            }
            if (c == null) {
             // private folders page: the selected folders
             val names = sel.toList()
             var cnt = 0
             var total = 0L
             var newest = 0L
             for (n in names) {
              for (f in VaultStore.videos(this, n)) {
               cnt++
               total += f.length()
               newest = Math.max(newest, f.lastModified())
              }
             }
             if (names.size == 1) {
              title = names[0]
              sec("پوشه")
              val fd = VaultStore.dir(this, names[0])
              row("مکان", fd.absolutePath)
              if (fd.lastModified() > 0L) newest = fd.lastModified()
              if (newest > 0L) row("تاریخ", infoDate(newest))
              row("اندازه کل", infoBytes(total))
              row("محتویات", fa(cnt.toString()) + " فیلم ها")
             } else {
              title = "ویژگی ها"
              row("محتویات", fa(cnt.toString()) + " فیلم ها")
              row("اندازه کل", infoBytes(total))
             }
            } else {
             // inside a locked folder: the selected videos
             val fs = VaultStore.videos(this, c).filter { sel.contains(it.name) }
             if (fs.isEmpty()) return
             if (fs.size == 1) {
              val f = fs[0]
              single = true
              title = f.name.substringBeforeLast('.')
              sec("فایل")
              row("فایل", f.name)
              row("مکان", f.absoluteFile.parent ?: VaultStore.dir(this, c).absolutePath)
              row("حجم", infoBytes(f.length()))
              if (f.lastModified() > 0L) row("تاریخ", infoDate(f.lastModified()))
              sec("رسانه")
              row("فرمت فایل", infoFormat(f.name))
              var w = 0
              var h = 0
              var dur = 0L
              val r = MediaMetadataRetriever()
              try {
               r.setDataSource(f.absolutePath)
               w = (r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH) ?: "0").toInt()
               h = (r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT) ?: "0").toInt()
               dur = (r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION) ?: "0").toLong()
              } catch (e: Throwable) {
              } finally {
               try {
                r.release()
               } catch (e: Throwable) {
               }
              }
              if (w > 0 && h > 0) row("رزولوشن", w.toString() + " x " + h.toString())
              if (dur > 0L) row("طول", fa(Ui.dur(dur)))
             } else {
              var total = 0L
              for (f in fs) total += f.length()
              title = "ویژگی ها"
              row("محتویات", fa(fs.size.toString()) + " فیلم ها")
              row("اندازه کل", infoBytes(total))
             }
            }
            showInfoDialog(title, single, hasSec, items)
           }

           private fun showInfoDialog(title: String, single: Boolean, hasSec: Boolean, items: ArrayList<Array<String>>) {
             val sc = resources.displayMetrics.widthPixels / 1080f
             fun u(x: Float): Int = Math.round(x * sc)
             val ink = Color.parseColor("#E6E8F0")
             val dim = Color.parseColor("#9AA3AF")
             val szPx = 39.4f * sc
             val secPx = 36.75f * sc

             fun tv(s: String, px: Float, col: Int, bold: Boolean): TextView {
              val t = TextView(this)
              t.text = s
              t.setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, px)
              t.setTextColor(col)
              if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
              return t
             }

             // label column: as wide as the longest label (single video: fixed width, as in the reference)
             val pt = tv("", szPx, dim, false).paint
             var lw = 0f
             for (en in items) if (en[0] == "r") lw = Math.max(lw, pt.measureText(en[1]))
             // a little extra room so a label never wraps into two lines (the values move slightly right)
             val labelW = if (single) Math.max(u(233.5f), Math.ceil(lw.toDouble()).toInt() + u(14f)) else Math.ceil(lw.toDouble()).toInt() + u(14f)

             val box = LinearLayout(this)
             box.orientation = LinearLayout.VERTICAL
             box.layoutDirection = View.LAYOUT_DIRECTION_LTR
             box.setPadding(u(73.5f), 0, u(73.5f), 0)

             // title: follows its own language (Persian on the right, Latin on the left)
             val th = tv(title, szPx, ink, true)
             th.setPadding(0, u(57f), 0, u(if (hasSec) 39f else 45f))
             box.addView(th, LinearLayout.LayoutParams(android.view.ViewGroup.LayoutParams.MATCH_PARENT, android.view.ViewGroup.LayoutParams.WRAP_CONTENT))

             for (en in items) {
              if (en[0] == "s") {
               val x = tv(en[1], secPx, ink, true)
               x.textAlignment = View.TEXT_ALIGNMENT_VIEW_START
               x.setPadding(0, u(10f), 0, u(10f))
               box.addView(x, LinearLayout.LayoutParams(android.view.ViewGroup.LayoutParams.MATCH_PARENT, android.view.ViewGroup.LayoutParams.WRAP_CONTENT))
              } else {
               val ln = LinearLayout(this)
               ln.orientation = LinearLayout.HORIZONTAL
               ln.layoutDirection = View.LAYOUT_DIRECTION_LTR
               ln.setPadding(0, u(12f), 0, u(12f))
               val a = tv(en[1], szPx, dim, false)
               a.textAlignment = View.TEXT_ALIGNMENT_VIEW_END
               a.maxLines = 1
               val b = tv(en[2], szPx, ink, false)
               b.textAlignment = View.TEXT_ALIGNMENT_VIEW_START
               ln.addView(a, LinearLayout.LayoutParams(labelW, android.view.ViewGroup.LayoutParams.WRAP_CONTENT))
               val bl = LinearLayout.LayoutParams(0, android.view.ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
               bl.leftMargin = u(40.5f)
               ln.addView(b, bl)
               box.addView(ln, LinearLayout.LayoutParams(android.view.ViewGroup.LayoutParams.MATCH_PARENT, android.view.ViewGroup.LayoutParams.WRAP_CONTENT))
              }
             }

             // very tall content scrolls instead of pushing the button off the screen
             val ctx = this
             val maxScroll = (resources.displayMetrics.heightPixels * 0.78f).toInt()
             val sv = object : ScrollView(ctx) {
              override fun onMeasure(wSpec: Int, hSpec: Int) {
               super.onMeasure(wSpec, View.MeasureSpec.makeMeasureSpec(Math.min(View.MeasureSpec.getSize(hSpec), maxScroll), View.MeasureSpec.AT_MOST))
              }
             }
             sv.isVerticalScrollBarEnabled = false
             sv.addView(box)

             val ok = TextView(this)
             ok.text = "Okay"
             ok.setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, szPx)
             ok.setTextColor(Color.parseColor("#3D8CF1"))
             ok.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL))
             ok.setPadding(u(30f), u(if (single) 4f else 39f), u(30f), u(56f))
             val okLp = LinearLayout.LayoutParams(android.view.ViewGroup.LayoutParams.WRAP_CONTENT, android.view.ViewGroup.LayoutParams.WRAP_CONTENT)
             okLp.gravity = android.view.Gravity.RIGHT
             okLp.rightMargin = u(59f)

             val root = LinearLayout(this)
             root.orientation = LinearLayout.VERTICAL
             root.layoutDirection = View.LAYOUT_DIRECTION_LTR
             root.addView(sv, LinearLayout.LayoutParams(android.view.ViewGroup.LayoutParams.MATCH_PARENT, android.view.ViewGroup.LayoutParams.WRAP_CONTENT))
             root.addView(ok, okLp)

             val dlg = android.app.Dialog(this)
             dlg.requestWindowFeature(android.view.Window.FEATURE_NO_TITLE)
             dlg.setContentView(root)
             val bg = android.graphics.drawable.GradientDrawable()
             bg.setColor(Color.parseColor("#424242"))
             bg.cornerRadius = u(5.25f).toFloat()
             dlg.window?.setBackgroundDrawable(bg)
             dlg.window?.setLayout(u(909f), android.view.WindowManager.LayoutParams.WRAP_CONTENT)
             ok.setOnClickListener { dlg.dismiss() }
             dlg.show()
           }


           // selected row: blue frame
           private fun markSel(v: View, on: Boolean) {
            v.background = if (on) Ui.rect(this, Color.parseColor("#1D3A63"), 14, blue, 2) else null
           }

           // selection circle: white ring; blue with a white check when selected
           private fun styleCircle(t: TextView, on: Boolean) {
            val g = GradientDrawable()
            g.shape = GradientDrawable.OVAL
            if (on) {
             g.setColor(blue)
             t.text = "✓"
            } else {
             g.setColor(Color.argb(90, 0, 0, 0))
             t.text = ""
            }
            g.setStroke(dp(2), Color.WHITE)
            t.background = g
            t.setTextColor(Color.WHITE)
            t.textSize = 14f
            t.setTypeface(t.typeface, Typeface.BOLD)
            t.gravity = Gravity.CENTER
            t.includeFontPadding = false
           }

           // grid tile: the picture with the selection circle in its top right corner (only while selecting)
           private fun withBadge(v: View, on: Boolean): FrameLayout {
            val f = FrameLayout(this)
            f.addView(v, FrameLayout.LayoutParams(MP, MP))
            if (selMode) {
             val c = TextView(this)
             styleCircle(c, on)
             val p = FrameLayout.LayoutParams(dp(26), dp(26), Gravity.TOP or Gravity.RIGHT)
             p.setMargins(0, dp(6), dp(6), 0)
             f.addView(c, p)
            }
            return f
           }

           // the "⋮" of a row; while selecting it turns into the selection circle
           private fun menuMark(key: String, click: () -> Unit): TextView {
            val on = selMode && sel.contains(key)
            val m = label(if (!selMode) "⋮" else "", if (!selMode) 24f else 14f, Ui.TEXT)
            if (selMode) {
             styleCircle(m, on)
             val lp = LinearLayout.LayoutParams(dp(26), dp(26))
             lp.setMargins(dp(14), 0, dp(14), 0)
             m.layoutParams = lp
            } else {
             m.setPadding(dp(14), dp(8), dp(14), dp(8))
             m.setOnClickListener { click() }
            }
            return m
           }

           private fun startSel(key: String) {
            selMode = true
            sel.add(key)
            refreshSel()
           }

           private fun toggleSel(key: String) {
            if (!sel.remove(key)) sel.add(key)
            if (sel.isEmpty()) selMode = false
            refreshSel()
           }

           private fun selectAllToggle() {
            if (sel.size >= curKeys.size) {
             sel.clear()
             selMode = false
            } else {
             sel.clear()
             sel.addAll(curKeys)
            }
            refreshSel()
           }

           private fun exitSel() {
            selMode = false
            sel.clear()
            refreshSel()
           }

           private fun pickedFiles(): List<File> = curFiles.filter { sel.contains(it.name) }

           private fun act(bb: LinearLayout, icon: String, text: String, click: () -> Unit) {
            val c = LinearLayout(this)
            c.orientation = LinearLayout.VERTICAL
            c.gravity = Gravity.CENTER
            c.setPadding(dp(2), dp(8), dp(2), dp(8))
            val i = label(icon, 20f, Ui.TEXT)
            i.gravity = Gravity.CENTER
            val t = label(text, 11f, if (text == "حذف") Ui.DANGER else Ui.TEXT)
            t.gravity = Gravity.CENTER
            t.maxLines = 1
            c.addView(i, LinearLayout.LayoutParams(WC, WC))
            c.addView(t, LinearLayout.LayoutParams(WC, WC))
            c.setOnClickListener { click() }
            bb.addView(c, LinearLayout.LayoutParams(0, WC, 1f))
           }

           private fun refreshSel() {
            curBar?.visibility = if (selMode) View.GONE else View.VISIBLE
            curSelBar?.visibility = if (selMode) View.VISIBLE else View.GONE
            selCount?.text = fa(sel.size.toString()) + " انتخاب شده"
            curAdapter?.notifyDataSetChanged()
            val bb = bottomBar ?: return
            bb.removeAllViews()
            if (!selMode || sel.isEmpty()) {
             bb.visibility = View.GONE
             return
            }
            bb.visibility = View.VISIBLE
            val name = cur
            if (name == null) {
             // folders page: one folder = rename / change lock / fingerprint / delete, several folders = delete
             if (sel.size == 1) {
              val n = sel.first()
              act(bb, "✏️", "تغییر نام") { startUnlock(n, 2) }
              if (VaultStore.noLock(this, n)) {
               act(bb, "🔒", "گذاشتن قفل") { startUnlock(n, 1) }
              } else {
               act(bb, "🔑", "رمز / الگو") { startUnlock(n, 1) }
               act(bb, "🖐️", "اثر انگشت") { startUnlock(n, 4) }
               act(bb, "🔓", "برداشتن قفل") { startUnlock(n, 6) }
              }
             }
             act(bb, "🗑️", "حذف") { confirmDeleteFolders(ArrayList(sel)) }
            } else {
             // videos page
             act(bb, "🔓", "خارج کردن") { confirmRestore(name, pickedFiles()) }
             act(bb, "📂", "انتقال به بیرون") { moveOutDialog(name, pickedFiles()) }
             act(bb, "🔒", "انتقال به قفل") { moveVaultDialog(name, pickedFiles()) }
             act(bb, "🗑️", "حذف") { confirmDeleteVideos(name, pickedFiles()) }
            }
           }

