           private fun fa(s: String): String {
            val sb = StringBuilder()
            for (ch in s) {
             if (ch in '0'..'9') sb.append('\u06F0' + (ch - '0')) else sb.append(ch)
            }
            return sb.toString()
           }

           private fun toast(s: String) {
            Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
           }

           override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            // the private folders page may show in the recent-apps list; inside a folder the screen is protected (see showDetail)
            // the page is drawn behind the status bar (like the folders page) so the top bar icons can move up to the selfie camera
            window.statusBarColor = Color.TRANSPARENT
            window.navigationBarColor = Ui.BG_BOTTOM
            window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
            val root = LinearLayout(this)
            root.orientation = LinearLayout.VERTICAL
            root.background = Ui.pageBg()
            root.layoutDirection = View.LAYOUT_DIRECTION_RTL
            content = LinearLayout(this)
            content.orientation = LinearLayout.VERTICAL
            root.addView(content, LinearLayout.LayoutParams(MP, MP))
            setContentView(root)
            loadLayout()
            pageOk = savedInstanceState?.getBoolean("pageOk", false) ?: false
            render()
            }

            override fun onSaveInstanceState(outState: Bundle) {
             super.onSaveInstanceState(outState)
             outState.putBoolean("pageOk", pageOk)
            }

            // lock of the private folders page (own PIN / pattern, fingerprint if chosen): the page stays empty until it is opened
            private fun gate(): Boolean {
             if (isFinishing) return false
             if (!AppLock.vaultLock(this) || pageOk) return true
             if (!askingPage) {
              askingPage = true
              external = true
              val i = Intent(this, LockActivity::class.java)
              i.putExtra("mode", "unlock")
              i.putExtra("sec", true)
              i.putExtra("slot", "vault")
              startActivityForResult(i, 77)
             }
             return false
            }

           override fun onResume() {
            super.onResume()
            external = false
            render()
           }

           // going home / to the recent apps: the opened folder locks and the private folders page is shown instead,
           // so the recent-apps preview shows that page (never the videos, never a white screen)
           override fun onUserLeaveHint() {
            super.onUserLeaveHint()
            if (!external && !isChangingConfigurations && cur != null) {
             selMode = false
             sel.clear()
             showList()
             window.decorView.invalidate()
            }
           }

           // leaving the app (or locking the phone) locks the opened folder again
           override fun onStop() {
            super.onStop()
            if (!external && !isChangingConfigurations) {
             cur = null
             pageOk = false
            }
            }

           override fun onDestroy() {
            alive = false
            pool.shutdownNow()
            super.onDestroy()
           }

           override fun onBackPressed() {
            if (selMode) {
             exitSel()
             return
            }
            if (cur != null) {
             cur = null
             showList()
            } else {
             super.onBackPressed()
            }
           }

           override fun finish() {
            super.finish()
            Nav.close(this)
           }

           private fun render() {
            if (!gate()) return
            val c = cur
            if (c == null) showList() else showDetail(c)
           }

           // ------------------------------------------------------------------ thumbnails
           private fun frameOf(path: String): Bitmap? {
            val r = MediaMetadataRetriever()
            return try {
             r.setDataSource(path)
             r.getFrameAtTime(1000000)
            } catch (e: Throwable) {
             null
            } finally {
             try {
              r.release()
             } catch (e: Throwable) {
             }
            }
           }

           private fun bindThumb(iv: ImageView, path: String) {
            iv.setImageBitmap(null)
            iv.tag = path
            val b = cache.get(path)
            if (b != null) {
             iv.setImageBitmap(b)
             return
            }
            if (!alive) return
            try {
             pool.execute {
              val got: Bitmap? = frameOf(path)
              if (got != null) {
               cache.put(path, got)
               ui.post {
                if (iv.tag == path) iv.setImageBitmap(got)
               }
              }
             }
            } catch (e: Throwable) {
            }
           }

           private fun thumbBox(w: Int, h: Int): FrameLayout {
            val f = FrameLayout(this)
            f.setBackgroundColor(Color.parseColor("#243044"))
            Ui.roundClip(f, 8)
            val iv = ImageView(this)
            iv.scaleType = ImageView.ScaleType.CENTER_CROP
            f.addView(iv, FrameLayout.LayoutParams(MP, MP))
            f.tag = iv
            f.layoutParams = LinearLayout.LayoutParams(dp(w), dp(h))
            return f
           }

           // ------------------------------------------------------------------ top bar / selection helpers
           private fun statusBarH(): Int {
            val id = resources.getIdentifier("status_bar_height", "dimen", "android")
            return if (id > 0) resources.getDimensionPixelSize(id) else dp(24)
           }

           // places the icons of the top bar (tbY) and the shaded edge under them (tbG) for the page that is open
           private fun applyTopBar() {
            val pg = if (cur == null) 0 else 1
            val maxTop = statusBarH() + dp(14)
            val minTop = Math.min(dp(12), maxTop)
            val top = minTop + ((maxTop - minTop) * tbY[pg] / 100f).toInt()
            curBar?.setPadding(dp(14), top, dp(14), dp(tbG[pg]))
            curSelBar?.setPadding(dp(14), top, dp(14), dp(tbG[pg]))
           }

           // thin shadow that falls from the edge of the top bar onto the list (same as the folders page)
           private fun withShade(v: View): View {
            val f = FrameLayout(this)
            f.addView(v, FrameLayout.LayoutParams(MP, MP))
            val shade = View(this)
            shade.background = GradientDrawable(
             GradientDrawable.Orientation.TOP_BOTTOM,
             intArrayOf(Color.argb(150, 0, 0, 0), Color.argb(55, 0, 0, 0), Color.TRANSPARENT)
            )
            f.addView(shade, FrameLayout.LayoutParams(MP, dp(8), Gravity.TOP))
            return f
           }

