           // ---------------- playlist ----------------
           // ---------------- delete current video ----------------
           private var pendingDelIndex = -1

           private fun confirmDeleteCurrent() {
            ui.removeCallbacks(hideRun)
            val name = titles.getOrElse(index) { "" }
            android.app.AlertDialog.Builder(this)
             .setTitle("حذف ویدئو؟")
             .setMessage(name + "\n\nاین فایل برای همیشه از گوشی پاک می‌شود.")
             .setPositiveButton("حذف") { _, _ -> deleteCurrent() }
             .setNegativeButton("لغو", null)
             .show()
           }

           private fun deleteCurrent() {
            if (index !in uris.indices) return
            val i = index
            val uri = Uri.parse(uris[i])
            if (uri.scheme == "file") {
             val okDel = try {
              java.io.File(uri.path ?: "").delete()
             } catch (e: Throwable) {
              false
             }
             if (okDel) afterDelete(i) else Toast.makeText(this, "حذف انجام نشد", Toast.LENGTH_SHORT).show()
             return
            }
            try {
             if (contentResolver.delete(uri, null, null) > 0) {
              afterDelete(i)
             } else {
              Toast.makeText(this, "حذف انجام نشد", Toast.LENGTH_SHORT).show()
             }
            } catch (e: SecurityException) {
             var asked = false
             try {
              if (Build.VERSION.SDK_INT >= 30) {
               val pi = android.provider.MediaStore.createDeleteRequest(contentResolver, listOf(uri))
               pendingDelIndex = i
               startIntentSenderForResult(pi.intentSender, 40, null, 0, 0, 0)
               asked = true
              } else if (Build.VERSION.SDK_INT >= 29 && e is android.app.RecoverableSecurityException) {
               pendingDelIndex = i
               startIntentSenderForResult(e.userAction.actionIntent.intentSender, 41, null, 0, 0, 0)
               asked = true
              }
             } catch (e2: Exception) {
             }
             if (!asked) Toast.makeText(this, "اجازه حذف داده نشد", Toast.LENGTH_SHORT).show()
            } catch (e: Exception) {
             Toast.makeText(this, "حذف انجام نشد", Toast.LENGTH_SHORT).show()
            }
           }

           private fun afterDelete(i: Int) {
            val u = uris.toMutableList()
            val t = titles.toMutableList()
            if (i in u.indices) u.removeAt(i)
            if (i in t.indices) t.removeAt(i)
            uris = u
            titles = t
            Toast.makeText(this, "ویدئو حذف شد 🗑", Toast.LENGTH_SHORT).show()
            if (uris.isEmpty()) {
             finish()
             return
            }
            vv.stopPlayback()
            loadAt(i.coerceAtMost(uris.size - 1))
           }

           override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
            super.onActivityResult(requestCode, resultCode, data)
            if (requestCode == 50) {
             val u = data?.getStringArrayExtra("uris")
             if (resultCode == RESULT_OK && u != null && u.isNotEmpty()) {
              val t = data?.getStringArrayExtra("titles")
              saveResume()
              prepared = false
              uris = u.toList()
              titles = t?.toList() ?: emptyList()
              pos = 0
              quietLoad = false
              loadAt((data?.getIntExtra("index", 0) ?: 0).coerceIn(0, uris.size - 1))
              pos = (data?.getIntExtra("startPos", 0) ?: 0).coerceAtLeast(0)
              if (data?.getBooleanExtra("autoNext", false) == true && repeatMode == 3) {
               repeatMode = 2
               updateRepeatIcon()
              }
             }
             return
            }
            if ((requestCode == 40 || requestCode == 41) && resultCode == RESULT_OK && pendingDelIndex in uris.indices) {
             if (requestCode == 41) {
              try {
               contentResolver.delete(Uri.parse(uris[pendingDelIndex]), null, null)
              } catch (e: Exception) {
              }
             }
             afterDelete(pendingDelIndex)
            }
            pendingDelIndex = -1
           }

