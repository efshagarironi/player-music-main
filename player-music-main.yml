            nArt.background = Ui.rect(this, Ui.CARD, 22, Ui.CARD_STROKE, 1)
            nArt.scaleType = ImageView.ScaleType.FIT_CENTER
            nArt.setImageResource(R.drawable.ic_music_fab)
            nArt.setPadding(dp(14), dp(14), dp(14), dp(14))
            Ui.roundClip(nArt, 22)
            val alp = LinearLayout.LayoutParams(side, side)
            alp.gravity = Gravity.CENTER_HORIZONTAL
            alp.topMargin = dp(14)
            nowPanel.addView(nArt, alp)

            nTitle = label("", 20f, Ui.TEXT, true)
            nTitle.gravity = Gravity.CENTER
            nTitle.maxLines = 2
            nTitle.ellipsize = TextUtils.TruncateAt.END
            val tlp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
            tlp.topMargin = dp(18)
            nowPanel.addView(nTitle, tlp)
            nArtist = label("", 14f, Ui.MUTED)
            nArtist.gravity = Gravity.CENTER
            nArtist.maxLines = 1
            nArtist.ellipsize = TextUtils.TruncateAt.END
            nowPanel.addView(nArtist, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

            // seek bar + times
            nSeek = SeekBar(this)
            nSeek.max = 1
            nSeek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
             override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
              if (fromUser) nCur.text = Ui.dur(p.toLong())
             }

             override fun onStartTrackingTouch(s: SeekBar?) {
              dragging = true
             }

             override fun onStopTrackingTouch(s: SeekBar?) {
              dragging = false
              MusicService.inst?.seekTo(s?.progress ?: 0)
             }
            })
