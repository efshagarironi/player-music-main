           // layout sheet: display mode, folders / videos per row, size of folders and videos
           private fun showLayoutSheet() {
            var wView = vView
            var wCF = vColsF
            var wCV = vColsV
            var wHideDetail = hideDetail
            var wHideList = hideList
            val wSz = vSz.copyOf()
            var wTab = if (cur == null) 0 else 1
            val blueBg = Color.parseColor("#1D3A63")
            val sheetBg = Color.parseColor("#263447")
            val txt = Color.parseColor("#E8ECF3")
            val gray = Color.parseColor("#3A4A60")
            val lineCol = Color.parseColor("#34455C")
            val refreshers = ArrayList<() -> Unit>()
            fun refreshAll() {
             for (r in refreshers) r()
            }

            val dlg = Dialog(this)
            dlg.requestWindowFeature(Window.FEATURE_NO_TITLE)
            val root = LinearLayout(this)
            root.orientation = LinearLayout.VERTICAL
            root.layoutDirection = View.LAYOUT_DIRECTION_RTL
            val bg = GradientDrawable()
            bg.setColor(sheetBg)
            val rd = dp(20).toFloat()
            bg.cornerRadii = floatArrayOf(rd, rd, rd, rd, 0f, 0f, 0f, 0f)
            root.background = bg
            val sc = ScrollView(this)
            val body = LinearLayout(this)
            body.orientation = LinearLayout.VERTICAL
            body.setPadding(dp(18), dp(20), dp(18), dp(8))
            sc.addView(body)
            root.addView(sc, LinearLayout.LayoutParams(MP, 0, 1f))

            fun sectionTitle(s: String, top: Int): TextView {
             val t = label(s, 16f, txt, true)
             t.setPadding(0, dp(top), 0, dp(4))
             return t
            }

            fun slider(title: String, tw: Int, nw: Int, max: Int, init: Int, text: (Int) -> String, onUser: (Int) -> Unit): Triple<LinearLayout, SeekBar, TextView> {
             val r = LinearLayout(this)
             r.orientation = LinearLayout.HORIZONTAL
             r.gravity = Gravity.CENTER_VERTICAL
             r.setPadding(dp(4), dp(10), dp(4), dp(2))
             val t = label(title, 13f, txt)
             val num = label(text(init), 14f, blue, true)
             num.gravity = Gravity.CENTER
