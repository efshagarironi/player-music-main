          package com.sharedl.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.drawable.Icon
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.MediaMetadata
          import android.media.MediaMetadataRetriever
          import android.media.MediaPlayer
          import android.media.PlaybackParams
          import android.media.audiofx.AudioEffect
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.widget.Toast

          // ---------------------------------------------------------------------------
          // One song of the music library
          // ---------------------------------------------------------------------------
          class Track(
           val id: Long,
           val uri: Uri,
           val title: String,
           val artist: String,
           val album: String,
           val duration: Long,
           val path: String
          ) {
           val dir: String = path.substringBeforeLast('/', "")
           val key: String = uri.toString()
          }

          // Cover art (picture inside the audio file), loaded in the background
          object MusicArt {
           private val cache = android.util.LruCache<String, Bitmap>(10)
           private val ui = Handler(Looper.getMainLooper())
           private val pool = java.util.concurrent.Executors.newSingleThreadExecutor()

           fun peek(t: Track): Bitmap? = cache.get(t.key)

           fun load(ctx: Context, t: Track, cb: (Bitmap?) -> Unit) {
            val c = cache.get(t.key)
            if (c != null) {
             cb(c)
             return
            }
            val app = ctx.applicationContext
            pool.execute {
             var bmp: Bitmap? = null
             val r = MediaMetadataRetriever()
             try {
              r.setDataSource(app, t.uri)
              val b = r.embeddedPicture
              if (b != null) {
               val o = BitmapFactory.Options()
               o.inJustDecodeBounds = true
               BitmapFactory.decodeByteArray(b, 0, b.size, o)
               var s = 1
               while (o.outWidth / s > 700) s *= 2
               val o2 = BitmapFactory.Options()
               o2.inSampleSize = s
               bmp = BitmapFactory.decodeByteArray(b, 0, b.size, o2)
              }
             } catch (e: Throwable) {
             } finally {
              try {
               r.release()
              } catch (e: Throwable) {
              }
             }
             if (bmp != null) cache.put(t.key, bmp)
             val out = bmp
             ui.post { cb(out) }
            }
           }
          }

          // ---------------------------------------------------------------------------
          // Background music playback (keeps playing with the screen off / app closed),
          // notification + lock screen + headset buttons through a MediaSession.
          // The queue and the play state live here; MusicActivity only shows them.
          // ---------------------------------------------------------------------------
          class MusicService : Service() {
           companion object {
            const val ACT_PLAY = "com.sharedl.player.music.PLAY"
            const val ACT_TOGGLE = "com.sharedl.player.music.TOGGLE"
            const val ACT_NEXT = "com.sharedl.player.music.NEXT"
            const val ACT_PREV = "com.sharedl.player.music.PREV"
            const val ACT_STOP = "com.sharedl.player.music.STOP"
            const val CH = "sharedl_music"
            const val NID = 4711

            @Volatile var inst: MusicService? = null
            var queue: List<Track> = emptyList()
            var order: IntArray = IntArray(0)
            var pos = -1
            var shuffle = false
            var repeat = 0 // 0 off, 1 all, 2 one
            var speed = 1f
            var sleepAt = 0L
            var onChange: (() -> Unit)? = null

            fun current(): Track? {
             val i = if (pos >= 0 && pos < order.size) order[pos] else -1
             return if (i >= 0 && i < queue.size) queue[i] else null
            }

            private fun makeOrder(start: Int) {
             val n = queue.size
             if (shuffle) {
              val l = ArrayList<Int>()
              for (k in 0 until n) if (k != start) l.add(k)
              l.shuffle()
              val o = IntArray(n)
              var p = 0
              if (start in 0 until n) {
               o[p] = start
               p++
              }
              for (k in l) {
               o[p] = k
               p++
              }
              order = o
              pos = 0
             } else {
              order = IntArray(n) { it }
              pos = if (start in 0 until n) start else 0
             }
            }

            fun send(ctx: Context, a: String) {
             val i = Intent(ctx, MusicService::class.java)
             i.action = a
             if (Build.VERSION.SDK_INT >= 26 && a == ACT_PLAY) ctx.startForegroundService(i) else ctx.startService(i)
            }

            // start playing a list from the given song
            fun playQueue(ctx: Context, list: List<Track>, start: Int, shuf: Boolean) {
             if (list.isEmpty()) return
             queue = list
             shuffle = shuf
             makeOrder(start)
             send(ctx, ACT_PLAY)
            }

            fun toggleOrStart(ctx: Context) {
             val s = inst
             if (s != null) s.toggle() else if (current() != null) send(ctx, ACT_PLAY)
            }

            fun applyShuffle(on: Boolean) {
             val cur = if (pos >= 0 && pos < order.size) order[pos] else -1
             shuffle = on
             if (queue.isNotEmpty()) makeOrder(cur)
             onChange?.invoke()
            }

            fun cycleRepeat() {
             repeat = (repeat + 1) % 3
             onChange?.invoke()
            }
           }

           private val ui = Handler(Looper.getMainLooper())
           private var mp: MediaPlayer? = null
           private var prepared = false
           private var wantPlay = false
           private var resumeOnFocus = false
           private var fg = false
           private var errors = 0
           private var art: Bitmap? = null
           private var session: MediaSession? = null
           private val audio by lazy { getSystemService(AUDIO_SERVICE) as AudioManager }

           private val focusL = AudioManager.OnAudioFocusChangeListener { c ->
            if (c == AudioManager.AUDIOFOCUS_LOSS) {
             resumeOnFocus = false
             if (isPlaying()) pause()
            } else if (c == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT) {
             if (isPlaying()) {
              resumeOnFocus = true
              pause()
             }
            } else if (c == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK) {
             try {
              mp?.setVolume(0.25f, 0.25f)
             } catch (e: Throwable) {
             }
            } else if (c == AudioManager.AUDIOFOCUS_GAIN) {
             try {
              mp?.setVolume(1f, 1f)
             } catch (e: Throwable) {
             }
             if (resumeOnFocus) {
              resumeOnFocus = false
              resume()
             }
            } else {
             resumeOnFocus = resumeOnFocus
            }
           }

           private val noisy = object : BroadcastReceiver() {
            override fun onReceive(c: Context, i: Intent) {
             if (isPlaying()) pause()
            }
           }

           private val sleepRun = Runnable {
            sleepAt = 0L
            if (isPlaying()) pause()
            onChange?.invoke()
           }

           override fun onBind(i: Intent?): IBinder? = null

           override fun onCreate() {
            super.onCreate()
            inst = this
            try {
             registerReceiver(noisy, IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY))
            } catch (e: Throwable) {
            }
            if (Build.VERSION.SDK_INT >= 26) {
             val ch = NotificationChannel(CH, "موزیک پلیر", NotificationManager.IMPORTANCE_LOW)
             ch.setShowBadge(false)
             (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
            }
            ensureSession()
           }

           override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
            inst = this
            val a = i?.action
            if (a == ACT_PLAY) {
             errors = 0
             goFg()
             loadCurrent(true)
            } else if (a == ACT_TOGGLE) {
             toggle()
            } else if (a == ACT_NEXT) {
             next(true)
            } else if (a == ACT_PREV) {
             prev()
            } else if (a == ACT_STOP) {
             stopAll()
            } else if (current() == null) {
             stopSelf()
            }
            return START_NOT_STICKY
           }

           override fun onDestroy() {
            ui.removeCallbacks(sleepRun)
            releaseMp()
            try {
             unregisterReceiver(noisy)
            } catch (e: Throwable) {
            }
            try {
             session?.isActive = false
             session?.release()
            } catch (e: Throwable) {
            }
            session = null
            if (inst === this) inst = null
            super.onDestroy()
           }

           // ------------------------------------------------------------ state
           fun isPlaying(): Boolean = try {
            prepared && mp?.isPlaying == true
           } catch (e: Throwable) {
            false
           }

           fun loading(): Boolean = wantPlay && !prepared

           fun duration(): Int = try {
            if (prepared) (mp?.duration ?: 0) else 0
           } catch (e: Throwable) {
            0
           }

           fun position(): Int = try {
            if (prepared) (mp?.currentPosition ?: 0) else 0
           } catch (e: Throwable) {
            0
           }

           fun sessionId(): Int = try {
            mp?.audioSessionId ?: 0
           } catch (e: Throwable) {
            0
           }

           // ------------------------------------------------------------ player
           private fun releaseMp() {
            val m = mp
            mp = null
            prepared = false
            if (m != null) {
             try {
              val i = Intent(AudioEffect.ACTION_CLOSE_AUDIO_EFFECT_CONTROL_SESSION)
              i.putExtra(AudioEffect.EXTRA_AUDIO_SESSION, m.audioSessionId)
              i.putExtra(AudioEffect.EXTRA_PACKAGE_NAME, packageName)
              sendBroadcast(i)
             } catch (e: Throwable) {
             }
             try {
              m.setOnPreparedListener(null)
              m.setOnCompletionListener(null)
              m.setOnErrorListener(null)
              m.release()
             } catch (e: Throwable) {
             }
            }
           }

           private fun requestFocus(): Boolean = try {
            audio.requestAudioFocus(focusL, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN) == AudioManager.AUDIOFOCUS_REQUEST_GRANTED
           } catch (e: Throwable) {
            true
           }

           private fun applySpeed(m: MediaPlayer) {
            if (Build.VERSION.SDK_INT >= 23) {
             try {
              val p = PlaybackParams()
              p.speed = speed
              m.playbackParams = p
             } catch (e: Throwable) {
             }
            }
           }

           private fun loadCurrent(play: Boolean) {
            val t = current()
            if (t == null) {
             stopAll()
             return
            }
            releaseMp()
            wantPlay = play
            art = MusicArt.peek(t)
            val m = MediaPlayer()
            mp = m
            try {
             m.setAudioAttributes(
              AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build()
             )
             m.setWakeMode(this, PowerManager.PARTIAL_WAKE_LOCK)
             m.setDataSource(this, t.uri)
             m.setOnPreparedListener { mm ->
              if (mp === mm) {
               prepared = true
               errors = 0
               try {
                val i = Intent(AudioEffect.ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION)
                i.putExtra(AudioEffect.EXTRA_AUDIO_SESSION, mm.audioSessionId)
                i.putExtra(AudioEffect.EXTRA_PACKAGE_NAME, packageName)
                i.putExtra(AudioEffect.EXTRA_CONTENT_TYPE, AudioEffect.CONTENT_TYPE_MUSIC)
                sendBroadcast(i)
               } catch (e: Throwable) {
               }
               if (wantPlay) {
                if (requestFocus()) {
                 try {
                  mm.start()
                  applySpeed(mm)
                 } catch (e: Throwable) {
                 }
                 goFg()
                } else {
                 wantPlay = false
                }
               }
               update()
              }
             }
             m.setOnCompletionListener { mm ->
              if (mp === mm) onDone()
             }
             m.setOnErrorListener { mm, _, _ ->
              if (mp === mm) onFail()
              true
             }
             m.prepareAsync()
            } catch (e: Throwable) {
             onFail()
             return
            }
            // cover for the notification
            MusicArt.load(this, t) { b ->
             val c = current()
             if (c != null && c.key == t.key && b != null) {
              art = b
              updateSession()
              refreshNotif()
             }
            }
            update()
           }

           private fun onFail() {
            errors++
            Toast.makeText(this, "این آهنگ پخش نشد", Toast.LENGTH_SHORT).show()
            if (errors >= queue.size || errors > 5) {
             wantPlay = false
             releaseMp()
             update()
            } else {
             next(false)
            }
           }

           private fun onDone() {
            if (repeat == 2) {
             loadCurrent(true)
            } else {
             next(false)
            }
           }

           fun toggle() {
            if (mp == null) {
             if (current() != null) {
              goFg()
              loadCurrent(true)
             }
            } else if (isPlaying() || loading()) {
             pause()
            } else {
             resume()
            }
           }

           fun pause() {
            wantPlay = false
            try {
             if (prepared) mp?.pause()
            } catch (e: Throwable) {
            }
            if (fg) {
             try {
              stopForeground(false)
             } catch (e: Throwable) {
             }
             fg = false
            }
            update()
           }

           fun resume() {
            val m = mp ?: return
            wantPlay = true
            if (prepared) {
             if (!requestFocus()) {
              wantPlay = false
              return
             }
             try {
              m.start()
              applySpeed(m)
             } catch (e: Throwable) {
             }
             goFg()
            }
            update()
           }

           fun next(manual: Boolean) {
            if (order.isEmpty()) return
            var np = pos + 1
            if (np >= order.size) {
             if (repeat == 1 || manual) {
              np = 0
             } else {
              // end of the list: stop on the first song
              pos = 0
              loadCurrent(false)
              return
             }
            }
            pos = np
            loadCurrent(true)
           }

           fun prev() {
            if (order.isEmpty()) return
            if (position() > 3000) {
             seekTo(0)
             return
            }
            pos = if (pos > 0) pos - 1 else order.size - 1
            loadCurrent(true)
           }

           fun jumpTo(p: Int) {
            if (p < 0 || p >= order.size) return
            pos = p
            loadCurrent(true)
           }

           fun seekTo(ms: Int) {
            try {
             if (prepared) mp?.seekTo(ms)
            } catch (e: Throwable) {
            }
            updateSession()
           }

           fun setSpeed(s: Float) {
            speed = s
            val m = mp
            if (m != null && isPlaying()) applySpeed(m)
            update()
           }

           fun setSleep(minutes: Int) {
            ui.removeCallbacks(sleepRun)
            if (minutes <= 0) {
             sleepAt = 0L
            } else {
             sleepAt = System.currentTimeMillis() + minutes * 60000L
             ui.postDelayed(sleepRun, minutes * 60000L)
            }
            onChange?.invoke()
           }

           fun stopAll() {
            ui.removeCallbacks(sleepRun)
            sleepAt = 0L
            wantPlay = false
            releaseMp()
            queue = emptyList()
            order = IntArray(0)
            pos = -1
            try {
             stopForeground(true)
            } catch (e: Throwable) {
            }
            fg = false
            onChange?.invoke()
            stopSelf()
           }

           // ------------------------------------------------------------ session + notification
           private fun ensureSession() {
            if (session != null) return
            try {
             val s = MediaSession(this, "ShareDLMusic")
             s.setFlags(MediaSession.FLAG_HANDLES_MEDIA_BUTTONS or MediaSession.FLAG_HANDLES_TRANSPORT_CONTROLS)
             s.setCallback(object : MediaSession.Callback() {
              override fun onPlay() {
               if (!isPlaying()) toggle()
              }

              override fun onPause() {
               if (isPlaying()) pause()
              }

              override fun onSkipToNext() {
               next(true)
              }

              override fun onSkipToPrevious() {
               prev()
              }

              override fun onSeekTo(p: Long) {
               seekTo(p.toInt())
              }

              override fun onStop() {
               stopAll()
              }
             })
             s.isActive = true
             session = s
            } catch (e: Throwable) {
            }
           }

           private fun updateSession() {
            val s = session ?: return
            try {
             val t = current()
             if (t != null) {
              val b = MediaMetadata.Builder()
              b.putString(MediaMetadata.METADATA_KEY_TITLE, t.title)
              b.putString(MediaMetadata.METADATA_KEY_ARTIST, t.artist)
              b.putString(MediaMetadata.METADATA_KEY_ALBUM, t.album)
              b.putLong(MediaMetadata.METADATA_KEY_DURATION, t.duration)
              val a = art
              if (a != null) b.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, a)
              s.setMetadata(b.build())
             }
             val st = if (isPlaying()) PlaybackState.STATE_PLAYING else if (loading()) PlaybackState.STATE_BUFFERING else PlaybackState.STATE_PAUSED
             val acts = PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or PlaybackState.ACTION_PLAY_PAUSE or
              PlaybackState.ACTION_SKIP_TO_NEXT or PlaybackState.ACTION_SKIP_TO_PREVIOUS or PlaybackState.ACTION_SEEK_TO or PlaybackState.ACTION_STOP
             val pb = PlaybackState.Builder()
             pb.setActions(acts)
             pb.setState(st, position().toLong(), if (isPlaying()) speed else 0f)
             s.setPlaybackState(pb.build())
            } catch (e: Throwable) {
            }
           }

           private fun action(icon: Int, title: String, a: String): Notification.Action {
            val i = Intent(this, MusicService::class.java)
            i.action = a
            val pi = PendingIntent.getService(this, a.hashCode(), i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
            return Notification.Action.Builder(Icon.createWithResource(this, icon), title, pi).build()
           }

           private fun buildNotif(): Notification {
            val t = current()
            val playing = isPlaying() || loading()
            val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, CH) else Notification.Builder(this)
            b.setSmallIcon(android.R.drawable.ic_media_play)
            b.setContentTitle(t?.title ?: "موزیک")
            b.setContentText(t?.artist ?: "")
            b.setOnlyAlertOnce(true)
            b.setShowWhen(false)
            b.setOngoing(playing)
            b.setVisibility(Notification.VISIBILITY_PUBLIC)
            val a = art
            if (a != null) b.setLargeIcon(a)
            val oi = Intent(this, MusicActivity::class.java)
            oi.putExtra("now", true)
            oi.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
            b.setContentIntent(PendingIntent.getActivity(this, 0, oi, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT))
            b.addAction(action(android.R.drawable.ic_media_previous, "قبلی", ACT_PREV))
            b.addAction(action(if (playing) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play, if (playing) "توقف" else "پخش", ACT_TOGGLE))
            b.addAction(action(android.R.drawable.ic_media_next, "بعدی", ACT_NEXT))
            b.addAction(action(android.R.drawable.ic_menu_close_clear_cancel, "بستن", ACT_STOP))
            val st = Notification.MediaStyle()
            val tok = session?.sessionToken
            if (tok != null) st.setMediaSession(tok)
            st.setShowActionsInCompactView(0, 1, 2)
            b.setStyle(st)
            return b.build()
           }

           private fun goFg() {
            if (current() == null) return
            try {
             val n = buildNotif()
             if (Build.VERSION.SDK_INT >= 29) {
              startForeground(NID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
             } else {
              startForeground(NID, n)
             }
             fg = true
            } catch (e: Throwable) {
            }
           }

           private fun refreshNotif() {
            if (current() == null) return
            try {
             (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).notify(NID, buildNotif())
            } catch (e: Throwable) {
            }
           }

           private fun update() {
            updateSession()
            refreshNotif()
            onChange?.invoke()
           }
          }

