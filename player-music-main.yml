             if (f != null) {
              if (selMode) toggleSel(f.name) else play(files, p)
             }
            }
            lv.setOnItemLongClickListener { _, _, p, _ ->
             val f = files.getOrNull(p)
             if (f != null) {
              if (selMode) toggleSel(f.name) else startSel(f.name)
             }
             true
            }
            col.addView(lv, LinearLayout.LayoutParams(MP, 0, 1f))
            content.addView(withShade(col), LinearLayout.LayoutParams(MP, 0, 1f))
            addBottomBar()
